<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10111a">
<title>BACH AI</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#10111a;color:#f5f5fb;font-family:Arial,sans-serif}
header{padding:18px 16px;background:#191b29;border-bottom:1px solid #303247}
h2{margin:0 0 5px;color:#b5a8ff;font-size:23px}
#status{color:#aaaabd;font-size:12px}
#chat{height:calc(100dvh - 154px);overflow:auto;padding:14px 12px 20px}
.msg{padding:12px 14px;margin:9px 0;border-radius:15px;max-width:92%;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.bot{background:#222538;border:1px solid #30344b}
.user{background:#5141a0;margin-left:auto}
.result{background:#202437;border:1px solid #3a3e59;border-radius:14px;padding:13px;margin:10px 0;max-width:95%;line-height:1.5}
.result h3{margin:0 0 8px;color:#c5baff;font-size:16px}
.result p{margin:0 0 10px;color:#e4e4ee;font-size:14px}
.result a{color:#b9adff;font-size:13px;overflow-wrap:anywhere}
.meta{color:#aaaabd;font-size:12px;margin-top:10px;white-space:pre-line}
footer{position:fixed;bottom:0;width:100%;display:flex;gap:8px;padding:10px;background:#191b29;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid #303247}
input{flex:1;min-width:0;padding:13px;border:1px solid #44465d;border-radius:12px;background:#10111a;color:white;font-size:16px}
button{padding:12px 16px;border:0;border-radius:12px;background:#7864ed;color:white;font-weight:bold}
button:disabled{opacity:.55}
#mais{width:46px;padding:0;font-size:26px;background:#303247}
#menu{display:none;position:fixed;left:10px;bottom:calc(68px + env(safe-area-inset-bottom));background:#222538;border:1px solid #3a3e59;border-radius:14px;padding:6px;z-index:5;min-width:240px}
#menu.aberto{display:block}
#menu button{display:block;width:100%;text-align:left;background:none;padding:12px 14px;font-weight:normal;font-size:15px}
.pensando{opacity:.85;border-style:dashed}
.msg img,.msg video{max-width:100%;border-radius:10px;display:block}
@media(min-width:700px){#chat{max-width:850px;margin:auto}footer{justify-content:center}footer input{max-width:700px}}
</style>
</head>

<body>

<header>
<h2>BACH AI 🧠</h2>
<div id="status">Carregando...</div>
</header>

<main id="chat"></main>

<footer>
<button id="mais" aria-label="Mais opções">+</button>
<input id="entrada" placeholder="Converse ou digite 'ajuda'..." autocomplete="off">
<button id="enviar">Enviar</button>
</footer>

<div id="menu">
<button data-acao="anexar">📎 Anexar foto, vídeo ou arquivo</button>
<button data-acao="profundo">🧠 Pensar bastante: desligado</button>
<button data-acao="arquivos">📁 Meus arquivos</button>
<button data-acao="piada">😄 Conta uma piada</button>
</div>
<input id="seletor" type="file" hidden multiple accept="image/*,video/*,.txt,.md,.js,.html,.css,.json,.csv,.py,.xml,.log,.ts,.java,.c,.cpp,.sql,.yml,.yaml">

<script type="module">
import { RizikBrain } from "./brain.js?v=11";
import { Saber } from "./saber.js?v=3";
import { Prog } from "./programacao.js?v=2";
import { Arquivos } from "./arquivos.js?v=1";

const chat = document.getElementById("chat");
const entrada = document.getElementById("entrada");
const botao = document.getElementById("enviar");
const status = document.getElementById("status");

const HISTORY_KEY = "bach_chat_history_v1";
const KEY_API = "bach_gemini_key";
const KEY_MODEL = "bach_gemini_model";
const STATUS = "BACH AI 1.1 • Arquivos, mídia, programação e pesquisa";

let history = [];
let pensando = null;
let modoProfundo = false;

try {
  history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
  if (!Array.isArray(history)) history = [];
} catch {
  history = [];
}

function salvar() {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-40)));
  } catch(e) {
    console.warn(e);
  }
}

function falar(texto,tipo="bot",origem="") {
  let seg = null;

  if (tipo === "bot" && pensando) {
    seg = pensando.fim();
    pensando = null;
  }

  const div = document.createElement("div");
  div.className = "msg " + tipo;
  div.textContent = String(texto);
  chat.appendChild(div);

  if (seg !== null) {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = (seg < 0.3 ? "⚡ Respondi na hora" : "⏱ Pensei por " + seg.toFixed(1) + " s") + (origem ? " • " + origem : "");
    chat.appendChild(m);
  }

  chat.scrollTop = chat.scrollHeight;

  history.push({text:String(texto),type:tipo});
  salvar();
}

function restaurar() {
  history = history.slice(-40);

  for (const item of history) {
    const div = document.createElement("div");
    div.className = "msg " + (item.type === "user" ? "user" : "bot");
    div.textContent = String(item.text || "");
    chat.appendChild(div);
  }

  chat.scrollTop = chat.scrollHeight;
}

function criarResultado(titulo,resumo,url) {
  if (!/^https?:\/\//i.test(url)) return;

  const card = document.createElement("article");
  card.className = "result";

  const h = document.createElement("h3");
  h.textContent = titulo;

  const p = document.createElement("p");
  p.textContent = resumo || "Consulte a fonte para mais detalhes.";

  const a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = "Abrir fonte ↗";

  card.append(h,p,a);
  chat.appendChild(card);
  chat.scrollTop = chat.scrollHeight;
}

function limpar(texto) {
  return String(texto || "")
    .replace(/<[^>]*>/g," ")
    .replace(/&nbsp;/g," ")
    .replace(/&amp;/g,"&")
    .replace(/&quot;/g,'"')
    .replace(/&#39;/g,"'")
    .replace(/\s+/g," ")
    .trim();
}

async function requisicao(url,tempo=20000) {
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(),tempo);

  try {
    const r = await fetch(url,{signal:controller.signal});
    if (!r.ok) throw new Error("HTTP "+r.status);
    return r;
  } finally {
    clearTimeout(timer);
  }
}

async function pesquisarWiki(q) {
  const params = new URLSearchParams({
    action:"query",
    list:"search",
    srsearch:q,
    srlimit:"5",
    format:"json",
    origin:"*"
  });

  const r = await requisicao("https://pt.wikipedia.org/w/api.php?"+params);

  const data = await r.json();
  const items = data?.query?.search || [];

  if (!items.length) throw new Error("Nenhum resultado.");

  for (const item of items) {
    criarResultado(
      item.title,
      limpar(item.snippet),
      "https://pt.wikipedia.org/wiki/"+encodeURIComponent(item.title.replace(/ /g,"_"))
    );
  }

  return "Wikipédia";
}

async function pesquisarInternet(q) {
  const inicio = performance.now();

  botao.disabled = true;
  passo("🌐 Pesquisando na internet: "+q);

  try {
    let fonte;

    try {
      const url =
        "https://r.jina.ai/http://html.duckduckgo.com/html/?q="+
        encodeURIComponent(q);

      const r = await requisicao(url,25000);
      const texto = await r.text();

      const regex = /^## \[(.*?)\]\((https?:\/\/[^)\s]+)\)/gm;
      const matches = [...texto.matchAll(regex)];
      const vistos = new Set();

      let quantidade = 0;

      for (let i=0;i<matches.length && quantidade<5;i++) {
        const titulo = limpar(matches[i][1]);
        let link = matches[i][2];

        try {
          const parsed = new URL(link);

          if (parsed.hostname.includes("duckduckgo.com")) {
            link = parsed.searchParams.get("uddg") || link;
          }
        } catch {}

        if (!/^https?:\/\//i.test(link) || vistos.has(link)) continue;
        if (/duckduckgo\.com\/html/i.test(link)) continue;

        const inicioResumo = matches[i].index + matches[i][0].length;
        const fimResumo = i+1 < matches.length
          ? matches[i+1].index
          : texto.length;

        const resumo = limpar(
          texto.slice(inicioResumo,fimResumo)
            .replace(/\[[^\]]*\]\([^)]*\)/g," ")
            .replace(/https?:\/\/\S+/g," ")
        ).slice(0,450);

        vistos.add(link);
        criarResultado(titulo,resumo,link);
        quantidade++;
      }

      if (!quantidade) throw new Error("Resultados indisponíveis.");

      fonte = "DuckDuckGo";

    } catch(e) {
      console.warn("Pesquisa alternativa:",e);
      passo("📚 DuckDuckGo falhou, tentando a Wikipédia...");
      fonte = await pesquisarWiki(q);
    }

    const segundos = ((performance.now()-inicio)/1000).toFixed(2);

    const div = document.createElement("div");
    div.className = "meta";
    div.textContent = "Fonte: "+fonte+" • "+segundos+" segundos";
    chat.appendChild(div);

    falar("Encontrei informações! Veja os resultados e consulte as fontes.");

  } catch(e) {
    console.error(e);
    falar("Não consegui pesquisar agora. Tente novamente.");
  } finally {
    botao.disabled = false;
    status.textContent = STATUS;
  }
}

async function clima(cidade) {
  botao.disabled = true;
  passo("📍 Procurando a cidade “"+cidade+"”...");

  try {
    const geo = await requisicao(
      "https://geocoding-api.open-meteo.com/v1/search?name="+
      encodeURIComponent(cidade)+"&count=5&language=pt&format=json"
    );

    const locais = (await geo.json()).results || [];
    const local = locais.find(x=>x.country_code==="BR") || locais[0];

    if (!local) throw new Error("Cidade não encontrada.");

    passo("🌡️ Achei "+local.name+(local.admin1 ? ", "+local.admin1 : "")+" ("+local.country+"). Buscando a previsão...");

    const params = new URLSearchParams({
      latitude:local.latitude,
      longitude:local.longitude,
      current:"temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m",
      daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
      timezone:"auto",
      forecast_days:"3"
    });

    const r = await requisicao("https://api.open-meteo.com/v1/forecast?"+params);

    const d = await r.json();
    const c = d.current;

    const condicao = codigo => {
      if (codigo===0) return "Céu limpo";
      if ([1,2,3].includes(codigo)) return "Nublado";
      if ([45,48].includes(codigo)) return "Neblina";
      if ([51,53,55,61,63,65,80,81,82].includes(codigo)) return "Chuva ou garoa";
      if ([95,96,99].includes(codigo)) return "Tempestade";
      return "Condição variável";
    };

    let resposta =
      "🌤️ CLIMA: "+local.name+"\n\n"+
      "Temperatura: "+c.temperature_2m+"°C\n"+
      "Sensação: "+c.apparent_temperature+"°C\n"+
      "Condição: "+condicao(c.weather_code)+"\n"+
      "Umidade: "+c.relative_humidity_2m+"%\n"+
      "Vento: "+c.wind_speed_10m+" km/h\n"+
      "Chuva agora: "+c.precipitation+" mm\n\n"+
      "PREVISÃO:\n";

    for (let i=0;i<d.daily.time.length;i++) {
      resposta +=
        d.daily.time[i]+": "+
        condicao(d.daily.weather_code[i])+
        ", mínima "+d.daily.temperature_2m_min[i]+"°C"+
        ", máxima "+d.daily.temperature_2m_max[i]+"°C"+
        ", chance de chuva "+
        d.daily.precipitation_probability_max[i]+"%\n";
    }

    falar(resposta);

  } catch(e) {
    console.error(e);
    falar("Não consegui consultar o clima dessa cidade.");
  } finally {
    botao.disabled = false;
    status.textContent = STATUS;
  }
}

function extrairPesquisa(texto) {
  const m = texto.match(
    /^(?:(?:fa[cç]a|faz|fazer|pode)\s+)?(?:uma\s+)?(?:pesquise|pesquisa|pesquisar|procure|buscar|busque|busca)\s+(?:(?:uma\s+)?(?:pesquisa|busca)\s+)?(?:na internet\s+|na web\s+|no google\s+)?(?:sobre\s+|por\s+|a respeito de\s+)?(.+)/i
  );

  return m ? m[1].trim() : null;
}

function extrairClima(texto) {
  const m = texto.match(
    /^(?:(?:qual|como)\s+(?:est[aá]\s+)?(?:o|a)\s+)?(?:(?:clima|previs[aã]o(?:\s+do\s+tempo)?)(?:\s+(?:em|de|para|na|no|do|da))?|tempo\s+(?:em|na|no|para))\s+(.+?)\??$/i
  );

  return m ? m[1].trim() : null;
}

async function perguntarIA(texto) {
  const key = localStorage.getItem(KEY_API);
  const model = localStorage.getItem(KEY_MODEL) || "gemini-3.5-flash-lite";

  botao.disabled = true;
  status.textContent = "Pensando...";

  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(),40000);

  try {
    let contents = history
      .filter(h=>h.type==="user" || h.type==="bot")
      .slice(-8)
      .map(h=>({
        role: h.type==="user" ? "user" : "model",
        parts:[{text:String(h.text).slice(0,3000)}]
      }));

    while (contents.length && contents[0].role !== "user") contents.shift();

    const r = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/"+
      encodeURIComponent(model)+":generateContent",
      {
        method:"POST",
        signal:controller.signal,
        headers:{"Content-Type":"application/json","x-goog-api-key":key},
        body:JSON.stringify({
          systemInstruction:{parts:[{text:"Você é a BACH AI, uma assistente em português do Brasil criada pelo usuário. Responda de forma clara, simpática e objetiva."}]},
          contents
        })
      }
    );

    if (!r.ok) {
      if (r.status===400 || r.status===403) falar("A chave parece inválida. Gere outra em aistudio.google.com e use /chave SUA_CHAVE.");
      else if (r.status===404) falar("Esse modelo não existe. Use /modelo NOME para trocar.");
      else if (r.status===429) falar("Atingi o limite grátis por agora. Aguarde um minuto e tente de novo.");
      else falar("A IA retornou erro "+r.status+". Tente novamente.");
      return;
    }

    const d = await r.json();
    const partes = d?.candidates?.[0]?.content?.parts || [];
    const resp = partes.map(x=>x.text || "").join("").trim();

    falar(resp || "A IA não devolveu resposta. Tente reformular.");

  } catch(e) {
    console.error(e);
    falar("Não consegui falar com a IA agora. Verifique a internet e tente de novo.");
  } finally {
    clearTimeout(timer);
    botao.disabled = false;
    status.textContent = STATUS;
  }
}

function pensar() {
  const div = document.createElement("div");
  div.className = "msg bot pensando";
  const t0 = performance.now();
  const linhas = [];

  const render = () => {
    div.textContent = "🤔 Pensando... " + ((performance.now()-t0)/1000).toFixed(1) + " s\n" + linhas.join("\n");
  };

  const timer = setInterval(render,200);
  chat.appendChild(div);
  render();
  chat.scrollTop = chat.scrollHeight;

  return {
    passo(t) {
      linhas.push("• "+t);
      if (linhas.length > 6) linhas.shift();
      render();
      chat.scrollTop = chat.scrollHeight;
    },
    fim() {
      clearInterval(timer);
      div.remove();
      return (performance.now()-t0)/1000;
    }
  };
}

function passo(t) {
  if (pensando) pensando.passo(t);
  status.textContent = t;
}

function mostrarPreview(p) {
  const div = document.createElement("div");
  div.className = "msg bot";
  const el = document.createElement(p.kind === "video" ? "video" : "img");
  el.src = p.url;
  if (p.kind === "video") { el.controls = true; el.muted = true; el.playsInline = true; }
  div.appendChild(el);
  chat.appendChild(div);
}

async function processarArquivo(f) {
  botao.disabled = true;
  falar("📎 "+f.name,"user");
  pensando = pensar();
  passo("📂 Abrindo "+f.name+" ("+Math.max(1,Math.round(f.size/1024))+" KB)...");

  try {
    const r = await Arquivos.lerMidia(f,passo);
    if (r.preview) mostrarPreview(r.preview);

    let resposta = r.resumo;
    let pasta = r.pasta;
    let texto = "";

    if (r.tipo === "texto") {
      passo("📖 Lendo e resumindo o conteúdo...");
      resposta = Saber.lerTexto(r.texto);
      pasta = Saber.isCode(r.texto) ? "Códigos" : "Textos";
      texto = r.texto;
    }

    passo("📁 Organizando em pastas...");
    const a = Arquivos.salvar({nome:f.name,pasta,texto,resumo:resposta.slice(0,300),tipo:r.tipo});
    falar(resposta+"\n\n📁 Guardei em: "+a.pasta+"/"+a.nome+"\nVeja tudo com /arquivos");
  } catch(e) {
    console.error(e);
    falar("Não consegui abrir esse arquivo. "+(e.message || ""));
  } finally {
    botao.disabled = false;
    status.textContent = STATUS;
  }
}

const maisBtn = document.getElementById("mais");
const menu = document.getElementById("menu");
const seletor = document.getElementById("seletor");

maisBtn.addEventListener("click",()=>menu.classList.toggle("aberto"));

menu.addEventListener("click",e=>{
  const b = e.target.closest("button[data-acao]");
  if (!b) return;

  menu.classList.remove("aberto");
  const acao = b.dataset.acao;

  if (acao === "anexar") seletor.click();

  if (acao === "profundo") {
    modoProfundo = !modoProfundo;
    b.textContent = "🧠 Pensar bastante: "+(modoProfundo ? "ligado" : "desligado");
    falar(modoProfundo
      ? "Modo pensar bastante LIGADO 🧠. Quando eu não souber algo, vou pesquisar a fundo sozinha e mostrar por onde estou procurando."
      : "Modo pensar bastante desligado. Só pesquiso quando você pedir.");
  }

  if (acao === "arquivos") { entrada.value = "/arquivos"; enviar(); }
  if (acao === "piada") { entrada.value = "conta uma piada"; enviar(); }
});

seletor.addEventListener("change",async()=>{
  const arquivos = [...seletor.files];
  seletor.value = "";
  for (const f of arquivos) await processarArquivo(f);
});

async function pesquisaProfunda(q, fundo = true) {
  if (/\b(piadas?|humor|engra[cç]ad[oa]s?)\b/i.test(q)) {
    falar("Piada eu tenho de sobra, nem precisa pesquisar! 😄\n\n"+Prog.humor("conta uma piada"),"bot","😄 meu repertório");
    return;
  }

  botao.disabled = true;
  passo((fundo ? "🔎 Pesquisando a fundo: " : "🔎 Pesquisando: ")+q);

  try {
    const r = await Saber.pesquisaProfunda(q, passo, fundo);
    falar(r.texto,"bot","🌐 internet, filtrada e resumida por mim");
    r.fontes.forEach(f => criarResultado(f.titulo,"",f.url));
  } catch(e) {
    console.error(e);
    if (e.message === "irrelevante") {
      falar("Procurei e li o que apareceu, mas nada estava claramente ligado a “"+q+"”, e prefiro não inventar. Tente outras palavras ou seja mais específico. 🔍");
    } else {
      falar("Não consegui pesquisar agora: a internet ou as fontes falharam. Tente de novo em instantes.");
    }
  } finally {
    botao.disabled = false;
    status.textContent = STATUS;
  }
}

function extrairProfundo(texto) {
  const m = texto.match(
    /^(?:(?:fa[cç]a|faz|pode)\s+)?(?:uma\s+)?(?:(?:pesquise|pesquisa|pesquisar|busque|busca|procure)\s+(?:a fundo|profundamente|em profundidade)|pesquisa profunda|aprofunde|\/profundo)\s*(?:sobre\s+|a respeito de\s+)?(.+)/i
  );

  return m ? m[1].trim() : null;
}

async function enviar() {
  const texto = entrada.value.trim();

  if (!texto || botao.disabled) return;

  entrada.value = "";

  // A chave nunca aparece no chat nem no histórico.
  if (/^\/chave\s+/i.test(texto)) {
    const valor = texto.replace(/^\/chave\s+/i,"").trim();
    falar("/chave ••••••","user");

    if (valor.toLowerCase()==="apagar") {
      localStorage.removeItem(KEY_API);
      falar("Chave apagada. Voltei ao modo sem IA externa.");
    } else if (valor.length < 20) {
      falar("Essa chave parece curta demais. Copie a chave inteira do Google AI Studio.");
    } else {
      localStorage.setItem(KEY_API,valor);
      falar("Chave salva neste aparelho ✅ Agora respondo perguntas e textos grandes com IA.");
    }
    return;
  }

  falar(texto,"user");
  pensando = pensar();
  passo("👀 Lendo sua mensagem...");

  const cmd = texto.toLowerCase().trim();

  if (cmd === "/clear" || cmd === "/limpar" || cmd === "limpar histórico") {
    history = [];
    localStorage.removeItem(HISTORY_KEY);
    chat.innerHTML = "";
    falar("Chat limpo! 🧹 Sua memória de aprendizado continua guardada.");
    return;
  }

  if (cmd.startsWith("/modelo ")) {
    const nome = texto.slice(8).trim();
    localStorage.setItem(KEY_MODEL,nome);
    falar("Modelo trocado para: "+nome);
    return;
  }

  // Pesquisa profunda: só quando você pedir.
  const profundo = extrairProfundo(texto);

  if (profundo !== null) {
    await pesquisaProfunda(profundo);
    return;
  }

  // Pesquisa: só quando você pedir.
  const consulta = extrairPesquisa(texto);

  if (consulta !== null) {
    await pesquisaProfunda(consulta,false);
    return;
  }

  // Clima: só pesquisa se você disser a cidade.
  if (/^(?:(?:qual|como)\s+(?:est[aá]\s+)?(?:o|a)\s+)?(?:clima|tempo|previs[aã]o(?:\s+do\s+tempo)?)\s*\??$/i.test(texto)) {
    falar("De qual cidade? Diga assim: clima em (sua cidade) 🌤️");
    return;
  }

  const cidade = extrairClima(texto);

  if (cidade) {
    await clima(cidade);
    return;
  }

  passo("📁 Verificando comandos de arquivos...");
  const arq = Arquivos.comando(texto);

  if (arq) {
    falar(arq,"bot","📁 seus arquivos");
    return;
  }

  passo("🧠 Consultando minha memória...");
  const resposta = RizikBrain.think(texto);

  if (resposta.intent === "longtext") {
    passo("📖 Lendo o texto inteiro...");
    const leitura = Saber.lerTexto(texto);
    const eCodigo = Saber.isCode(texto);
    const a = Arquivos.salvar({texto,pasta:eCodigo ? "Códigos" : "Textos",resumo:leitura.slice(0,300)});
    falar(leitura+"\n\n📁 Guardei em: "+a.pasta+"/"+a.nome+"\nVeja tudo com /arquivos");
    return;
  }

  if (resposta.handled) {
    falar(resposta.text,"bot","🧠 minha memória e regras");
    return;
  }

  passo("😄 Vendo se é conversa ou piada...");
  const graca = Prog.humor(texto);

  if (graca) {
    falar(graca,"bot","😄 meu repertório de humor");
    return;
  }

  passo("💻 Vendo se é sobre programação...");
  const prog = Prog.responder(texto);

  if (prog) {
    falar(prog,"bot","💻 meu conhecimento de programação");
    return;
  }

  passo("📚 Procurando no que já aprendi...");
  const conhecido = Saber.buscarConhecimento(texto);

  if (conhecido) {
    falar(conhecido,"bot","📚 o que aprendi pesquisando antes");
    return;
  }

  if (modoProfundo) {
    await pesquisaProfunda(texto);
    return;
  }

  if (localStorage.getItem(KEY_API)) {
    await perguntarIA(texto);
    return;
  }

  falar(
    Prog.desconhecido()+"\n\n"+
    "Você pode:\n"+
    "• me ensinar: ensine: pergunta => resposta\n"+
    "• pedir: pesquise a fundo sobre o assunto\n"+
    "• ligar \"Pensar bastante\" no botão + para eu pesquisar sozinha\n"+
    "• ver o clima: clima em (sua cidade)\n\n"+
    "Digite \"ajuda\" para ver tudo."
  );
}

botao.addEventListener("click",enviar);

entrada.addEventListener("keydown",e=>{
  if (e.key==="Enter") enviar();
});

restaurar();

status.textContent = STATUS;

if (!history.length) {
  falar("Olá! Sou a BACH AI 🧠. Vamos evoluir juntos! Digite \"ajuda\" para ver o que eu faço.");
}
</script>
