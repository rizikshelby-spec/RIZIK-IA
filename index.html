<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>BACH AI</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#10111a;color:#f5f5fb;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{padding:12px 16px;background:#191b29;border-bottom:1px solid #303247;flex:none}
h2{margin:0 0 3px;color:#b5a8ff;font-size:20px}
#status{color:#aaaabd;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat{flex:1;overflow:auto;padding:10px 10px 14px;width:100%;max-width:850px;margin:0 auto}
.msg{padding:8px 11px;margin:6px 0;border-radius:14px;max-width:82%;width:fit-content;line-height:1.45;overflow-wrap:anywhere;font-size:14px;backdrop-filter:blur(6px)}
.msg .t{white-space:pre-wrap}
.bot{background:rgba(34,37,56,.55);border:1px solid rgba(90,96,130,.35);margin-right:auto}
.user{background:rgba(81,65,160,.55);border:1px solid rgba(140,120,240,.3);margin-left:auto}
.pensando{opacity:.85;border-style:dashed;white-space:pre-line}
.acoes{display:flex;gap:6px;margin:-2px 0 6px}
.acoes button{padding:3px 9px;font-size:12px;font-weight:normal;background:rgba(255,255,255,.08);border-radius:10px}
.meta{color:#8d8fa6;font-size:11px;margin:2px 4px 4px;white-space:pre-line}
.cartao{border:1px solid rgba(120,100,237,.4);border-radius:10px;margin:6px 0;background:rgba(0,0,0,.25);overflow:hidden;min-width:230px}
.topo{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:12px;color:#c5baff}
.topo span{flex:1}
.topo button{padding:4px 9px;font-size:12px;font-weight:normal;background:rgba(255,255,255,.1);border-radius:8px}
.cartao details{border-top:1px solid rgba(255,255,255,.08)}
.cartao summary{padding:5px 8px;font-size:12px;color:#aaaabd;cursor:pointer}
.cartao pre{margin:0;padding:8px;max-height:320px;overflow:auto;font-size:12px;line-height:1.4;white-space:pre-wrap;color:#e4e4ee}
.result{background:rgba(32,36,55,.6);border:1px solid #3a3e59;border-radius:12px;padding:10px;margin:6px 0;max-width:88%;font-size:13px}
.result h3{margin:0 0 6px;color:#c5baff;font-size:14px}.result a{color:#b9adff;overflow-wrap:anywhere}
.msg img,.msg video{max-width:100%;border-radius:10px;display:block}
footer{flex:none;display:flex;gap:6px;padding:8px 10px;background:#191b29;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid #303247}
input[type=text]{flex:1;min-width:0;padding:11px;border:1px solid #44465d;border-radius:12px;background:#10111a;color:#fff;font-size:16px}
button{padding:10px 14px;border:0;border-radius:12px;background:#7864ed;color:#fff;font-weight:bold;cursor:pointer}
button.stop{background:#c0392b}
#mais,#mic{width:42px;padding:0;font-size:20px;background:#303247}
#mic.gravando{background:#c0392b}
#menu{display:none;position:fixed;left:10px;bottom:calc(64px + env(safe-area-inset-bottom));background:#222538;border:1px solid #3a3e59;border-radius:14px;padding:6px;z-index:5;min-width:250px}
#menu.aberto{display:block}
#menu button{display:block;width:100%;text-align:left;background:none;padding:11px 12px;font-weight:normal;font-size:15px}
#hist{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;align-items:flex-end;justify-content:center}
#hist.aberto{display:flex}
.hbox{background:#191b29;border:1px solid #303247;border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:88dvh;display:flex;flex-direction:column;padding:12px;gap:8px}
.htopo{display:flex;gap:8px;align-items:center}.htopo b{color:#c5baff;white-space:nowrap}
.htopo input{padding:8px 10px;font-size:14px}.htopo button{padding:8px 12px;background:#303247}
.hlista{overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px;min-height:120px}
.hitem{display:flex;gap:6px;align-items:center;background:rgba(34,37,56,.6);border:1px solid #3a3e59;border-radius:12px;padding:8px 10px}
.hitem.atual{border-color:#7864ed}.hinfo{flex:1;min-width:0;cursor:pointer}
.htit{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hmeta{font-size:11px;color:#8d8fa6;margin-top:2px}
.hitem button{background:none;padding:6px 8px}.hvazio{color:#8d8fa6;text-align:center;padding:24px 0;font-size:14px}
.hpag{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.hpag button{min-width:32px;padding:6px 0;font-size:13px;background:#303247}
.hpag button.on{background:#7864ed}.hpag button.vazia{opacity:.35}.hpag button:disabled{opacity:.3}
.hrod{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:12px;color:#8d8fa6}
.hrod button{padding:6px 10px;font-size:12px;background:#303247}
</style>

<header><h2>BACH AI 🧠</h2><div id="status">Carregando...</div></header>

<script type="module">
import { RizikBrain } from "./brain.js?v=12";
import { Saber } from "./saber.js?v=4";
import { Prog } from "./programacao.js?v=3";
import { Arquivos } from "./arquivos.js?v=1";
import { Mente } from "./mente.js?v=6";
import { Fatos } from "./fatos.js?v=1";
import { Historico } from "./historico.js?v=1";
import { Base } from "./base.js?v=1";

const $ = id => document.getElementById(id);
const chat = $("chat"), entrada = $("entrada"), botao = $("enviar"), status = $("status"), hist = $("hist");
const HISTORY_KEY = "bach_chat_history_v1", KEY_API = "bach_gemini_key", KEY_MODEL = "bach_gemini_model";
const STATUS = "BACH AI 3.0 • Conversa, código, jogos, arquivos, histórico e pesquisa";
const LONGO = 700;

let history = [], pensando = null, modoProfundo = false, lerAuto = false;
let ocupado = false, cancelado = false, ctrl = null, ultimoArquivo = null;
try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); if (!Array.isArray(history)) history = []; } catch { history = []; }
const salvarHist = () => { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-40).map(h => ({ ...h, text: String(h.text).slice(0, 20000) })))); } catch (e) { console.warn(e); }
  try { Historico.salvarAtual(history); } catch (e) { console.warn(e); } };

function busy(b) { ocupado = b; botao.textContent = b ? "⏹" : "Enviar"; botao.classList.toggle("stop", b); if (!b) status.textContent = STATUS; }

/* ---------- utilitários ---------- */
async function copiar(t, btn) {
  try { await navigator.clipboard.writeText(t); }
  catch { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = "✅ Copiado"; setTimeout(() => btn.textContent = o, 1500); }
}
function baixar(t, nome) {
  const u = URL.createObjectURL(new Blob([t], { type: /\.json$/.test(nome) ? "application/json" : "text/plain;charset=utf-8" }));
  const a = document.createElement("a"); a.href = u; a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(u), 3000);
}
const EXT = { html: "html", js: "js", javascript: "js", css: "css", python: "py", py: "py", json: "json", sql: "sql", java: "java", ts: "ts" };
function mk(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function cartao(titulo, conteudo, arquivo, aberto, previa) {
  const c = mk("div", "cartao"), top = mk("div", "topo"), b1 = mk("button", "", "📋 Copiar"), b2 = mk("button", "", "⬇️ Baixar");
  b1.onclick = () => copiar(conteudo, b1); b2.onclick = () => baixar(conteudo, arquivo);
  top.append(mk("span", "", titulo), b1, b2);
  const d = mk("details"); if (aberto) d.open = true;
  d.append(mk("summary", "", "Ver conteúdo"), mk("pre", "", previa && conteudo.length > previa ? conteudo.slice(0, previa) + "\n\n[... prévia: o arquivo completo tem " + conteudo.length + " caracteres; use Copiar ou Baixar]" : conteudo));
  c.append(top, d); return c;
}

/* ---------- bolhas ---------- */
function montar(texto, tipo) {
  const w = mk("div", "msg " + tipo);
  const p = String(texto).split(/```([\w+-]*)[ \t]*\n?([\s\S]*?)```/g);
  for (let i = 0; i < p.length; i += 3) {
    const t = p[i].trim();
    if (t) {
      if (t.length > (tipo === "user" ? LONGO : 3500)) {
        const n = t.split(/\n/).length;
        w.appendChild(cartao("📄 Texto longo • " + t.split(/\s+/).length + " palavras, " + n + " linhas", t, "texto-bach.txt", false));
      } else w.appendChild(mk("div", "t", t));
    }
    if (i + 2 < p.length) {
      const lang = (p[i + 1] || "").toLowerCase(), code = p[i + 2].replace(/\n$/, ""), n = code.split("\n").length;
      w.appendChild(cartao("💻 " + (lang || "código") + " • " + n + " linhas", code, "bach-codigo." + (EXT[lang] || "txt"), n <= 18));
    }
  }
  return w;
}
function textoFalavel(t) {
  return String(t).replace(/```[\s\S]*?```/g, " (código na tela) ").replace(/[*_#`>|]/g, " ").replace(/https?:\/\/\S+/g, " ").replace(/\s+/g, " ").trim();
}
function ler(texto, btn) {
  if (!("speechSynthesis" in window)) return;
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); if (btn) btn.textContent = "🔊 Ouvir"; return; }
  const u = new SpeechSynthesisUtterance(textoFalavel(texto).slice(0, 4000)); u.lang = "pt-BR";
  u.onend = u.onerror = () => { if (btn) btn.textContent = "🔊 Ouvir"; };
  if (btn) btn.textContent = "⏹ Parar"; speechSynthesis.speak(u);
}
function acoes(texto) {
  const a = mk("div", "acoes"), b1 = mk("button", "", "🔊 Ouvir"), b2 = mk("button", "", "📋 Copiar");
  b1.onclick = () => ler(texto, b1); b2.onclick = () => copiar(texto, b2);
  a.append(b1, b2); return a;
}

function falar(texto, tipo = "bot", origem = "", forcar = false) {
  if (tipo === "bot" && cancelado && !forcar) return;
  let seg = null;
  if (tipo === "bot" && pensando) { seg = pensando.fim(); pensando = null; }
  chat.appendChild(montar(texto, tipo));
  if (tipo === "bot") chat.appendChild(acoes(texto));
  if (seg !== null) chat.appendChild(mk("div", "meta", (seg < 0.3 ? "⚡ Respondi na hora" : "⏱ Pensei por " + seg.toFixed(1) + " s") + (origem ? " • " + origem : "")));
  chat.scrollTop = chat.scrollHeight;
  history.push({ text: String(texto), type: tipo }); salvarHist();
  if (tipo === "bot" && lerAuto) ler(texto);
}
function restaurar() {
  history = history.slice(-40);
  for (const h of history) { chat.appendChild(montar(h.text || "", h.type === "user" ? "user" : "bot")); if (h.type !== "user") chat.appendChild(acoes(h.text || "")); }
  chat.scrollTop = chat.scrollHeight;
}
function criarResultado(titulo, resumo, url) {
  if (!/^https?:\/\//i.test(url)) return;
  const c = mk("article", "result"), a = mk("a", "", "Abrir fonte ↗");
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
  c.append(mk("h3", "", titulo)); if (resumo) c.append(mk("div", "", resumo)); c.append(a);
  chat.appendChild(c); chat.scrollTop = chat.scrollHeight;
}

/* ---------- pensando / cancelar ---------- */
function pensar() {
  const div = mk("div", "msg bot pensando"), t0 = performance.now(), linhas = [];
  const render = () => { div.textContent = "🤔 Pensando... " + ((performance.now() - t0) / 1000).toFixed(1) + " s\n" + linhas.join("\n") + "\n(toque em ⏹ para cancelar)"; };
  const timer = setInterval(render, 200); chat.appendChild(div); render(); chat.scrollTop = chat.scrollHeight;
  return { passo(t) { linhas.push("• " + t); if (linhas.length > 5) linhas.shift(); render(); }, fim() { clearInterval(timer); div.remove(); return (performance.now() - t0) / 1000; } };
}
function passo(t) { if (pensando) pensando.passo(t); status.textContent = t; }
function parar() {
  cancelado = true; if (ctrl) ctrl.abort();
  if (pensando) { pensando.fim(); pensando = null; }
  speechSynthesis.cancel(); busy(false);
  falar("⏹ Cancelei. Pode mandar outra coisa.", "bot", "", true);
}

/* ---------- rede ---------- */
async function requisicao(url, tempo = 20000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), tempo);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return r; } finally { clearTimeout(t); }
}
async function clima(cidade) {
  try {
    passo("📍 Procurando “" + cidade + "”...");
    const geo = await (await requisicao("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(cidade) + "&count=5&language=pt&format=json")).json();
    const L = geo.results || [], l = L.find(x => x.country_code === "BR") || L[0];
    if (!l) throw new Error("Cidade não encontrada.");
    passo("🌡️ Buscando a previsão de " + l.name + "...");
    const p = new URLSearchParams({ latitude: l.latitude, longitude: l.longitude, current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m", daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max", timezone: "auto", forecast_days: "3" });
    const d = await (await requisicao("https://api.open-meteo.com/v1/forecast?" + p)).json(), c = d.current;
    const cond = k => k === 0 ? "Céu limpo" : [1, 2, 3].includes(k) ? "Nublado" : [45, 48].includes(k) ? "Neblina" : [51, 53, 55, 61, 63, 65, 80, 81, 82].includes(k) ? "Chuva ou garoa" : [95, 96, 99].includes(k) ? "Tempestade" : "Variável";
    let r = "🌤️ CLIMA: " + l.name + "\n\nTemperatura: " + c.temperature_2m + "°C (sensação " + c.apparent_temperature + "°C)\nCondição: " + cond(c.weather_code) + "\nUmidade: " + c.relative_humidity_2m + "%\nVento: " + c.wind_speed_10m + " km/h\n\nPREVISÃO:\n";
    d.daily.time.forEach((x, i) => r += x + ": " + cond(d.daily.weather_code[i]) + ", " + d.daily.temperature_2m_min[i] + "°–" + d.daily.temperature_2m_max[i] + "°C, chuva " + d.daily.precipitation_probability_max[i] + "%\n");
    falar(r);
  } catch (e) { console.error(e); falar("Não consegui consultar o clima dessa cidade."); }
}
const extrairPesquisa = t => (t.match(/^(?:(?:fa[cç]a|faz|fazer|pode)\s+)?(?:uma\s+)?(?:pesquise|pesquisa|pesquisar|procure|buscar|busque|busca)\s+(?:(?:uma\s+)?(?:pesquisa|busca)\s+)?(?:na internet\s+|na web\s+|no google\s+)?(?:sobre\s+|por\s+|a respeito de\s+)?(.+)/i) || [])[1]?.trim() ?? null;
const extrairClima = t => (t.match(/^(?:(?:qual|como)\s+(?:est[aá]\s+)?(?:o|a)\s+)?(?:(?:clima|previs[aã]o(?:\s+do\s+tempo)?)(?:\s+(?:em|de|para|na|no|do|da))?|tempo\s+(?:em|na|no|para))\s+(.+?)\??$/i) || [])[1]?.trim() ?? null;
const extrairProfundo = t => (t.match(/^(?:(?:fa[cç]a|faz|pode)\s+)?(?:uma\s+)?(?:(?:pesquise|pesquisa|pesquisar|busque|busca|procure)\s+(?:a fundo|profundamente|em profundidade)|pesquisa profunda|aprofunde|\/profundo)\s*(?:sobre\s+|a respeito de\s+)?(.+)/i) || [])[1]?.trim() ?? null;

const lim = x => String(x).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
async function noticias(q) {
  passo("📰 Buscando as manchetes de hoje...");
  try {
    const txt = await (await requisicao("https://r.jina.ai/http://html.duckduckgo.com/html/?df=d&q=" + encodeURIComponent(q), 25000)).text();
    const ms = [...txt.matchAll(/^## \[(.*?)\]\((https?:\/\/[^)\s]+)\)/gm)], itens = [], vistos = new Set();
    for (let i = 0; i < ms.length && itens.length < 6; i++) {
      let l = ms[i][2]; try { const u = new URL(l); if (u.hostname.includes("duckduckgo.com")) l = u.searchParams.get("uddg") || l; } catch {}
      if (!/^https?:\/\//.test(l) || vistos.has(l) || /duckduckgo\.com/.test(l)) continue; vistos.add(l);
      const a = ms[i].index + ms[i][0].length, b = i + 1 < ms.length ? ms[i + 1].index : txt.length;
      itens.push({ t: lim(ms[i][1]), l, s: lim(txt.slice(a, b).replace(/\[[^\]]*\]\([^)]*\)/g, " ").replace(/https?:\/\/\S+/g, " ")).slice(0, 180) });
    }
    if (!itens.length) throw new Error("vazio");
    falar("📰 Manchetes de " + new Date().toLocaleDateString("pt-BR") + ":\n\n" + itens.map(x => "• " + x.t + (x.s ? "\n  " + x.s : "")).join("\n\n"), "bot", "🌐 DuckDuckGo");
    itens.forEach(x => { try { criarResultado(new URL(x.l).hostname.replace(/^www\./, ""), "", x.l); } catch {} });
  } catch (e) { console.error(e); falar("Não consegui buscar as notícias agora. Tente de novo ou diga: pesquise sobre ..."); }
}
async function pesquisaProfunda(q, fundo = true) {
  if (/\b(piadas?|humor|engra[cç]ad[oa]s?)\b/i.test(q)) { falar("Piada eu tenho de sobra! 😄\n\n" + Prog.humor("conta uma piada"), "bot", "😄 meu repertório"); return; }
  passo((fundo ? "🔎 Pesquisando a fundo: " : "🔎 Pesquisando: ") + q);
  try {
    const r = await Saber.pesquisaProfunda(Mente.tema(q) || q, passo, fundo);
    const tx = r.texto.replace(/\n\n💬 Em poucas palavras:[^\n]*/, "").replace(/\n\n🔍 Como cheguei nisso:[^\n]*/, "").replace(/\nℹ️ Eu escolho[^\n]*/, "").replace(/\n\n💾 Guardei[^\n]*/, "").replace(/\n\n🚫 Não guardei[^\n]*/, "");
    if (r.conf !== "baixa") Mente.lembrarTema(Mente.tema(q) || q);
    falar(tx, "bot", "🌐 internet, filtrada e resumida");
    if (r.conf !== "baixa") Arquivos.salvar({ nome: "pesquisa-" + q.slice(0, 24), pasta: Mente.pasta("Pesquisas"), texto: r.texto, tipo: "pesquisa" });
    r.fontes.forEach(f => criarResultado(f.titulo, "", f.url));
  } catch (e) {
    console.error(e);
    falar(e.message === "irrelevante" ? "Procurei, mas nada estava claramente ligado a “" + q + "”, e prefiro não inventar. Tente outras palavras. 🔍" : "Não consegui pesquisar agora. Tente de novo em instantes.");
  }
}

/* ---------- IA (Gemini) ---------- */
const SISTEMA =
`Você é a BACH AI, assistente em português do Brasil criada pelo usuário. Seja simpática, direta e clara; explique para iniciantes, mas vá fundo quando pedirem nível intermediário ou avançado.
Você sabe: conversar; escrever e resumir textos; interpretar textos e códigos colados (explique o que são, o que fazem e o que está errado); programar em JavaScript, HTML, CSS, Python, SQL e outras; criar telas, sites, jogos e aplicativos; e ensinar a criar uma IA do zero.
REGRAS DE FORMATO:
- Todo código, arquivo ou texto que o usuário vá copiar vai em bloco de código com três crases e a linguagem (ex.: html, js). O app mostra cada bloco como um cartão com botões Copiar e Baixar. Nunca coloque código solto no meio do texto.
- Antes de cada bloco diga em 1 linha o nome do arquivo e onde colar. Entregue o arquivo COMPLETO, pronto para colar, nunca pedaços soltos, a menos que peçam só uma correção.
- Para jogos e apps simples, entregue um único arquivo HTML (CSS e JS dentro) que funcione no celular.
- Respostas curtas para perguntas simples. Em tarefas grandes, dê o passo a passo numerado.
JOGOS COM VOCÊ: você sabe jogar forca, jogo da velha (desenhe com texto), adivinhação de número, quiz, 20 perguntas, stop e charadas. Guarde o estado do jogo pelo histórico, diga de quem é a vez e confira as regras com honestidade.
IA DO ZERO: ensine nesta ordem — 1) entrada e saída (chat), 2) regras e normalização do texto, 3) memória que aprende (ensine: pergunta => resposta), 4) busca de informação, 5) ler arquivos, 6) conectar um modelo de linguagem por API, com a chave nunca dentro do código do GitHub. Diga sempre por qual arquivo começar e o que colar nele.
HONESTIDADE: se não souber, diga. Não invente fatos, links ou funções. Use o histórico para entender "isso", "esse texto", "ele". Se o usuário colar um texto ou código sem pergunta, explique em poucas linhas o que é e ofereça próximos passos.
PRECISÃO: responda só o que foi perguntado, com fatos verificáveis. Dê a mesma resposta para a mesma pergunta. Se houver incerteza, diga qual parte é incerta. Em contas, mostre o cálculo. Em datas, números e nomes, só afirme se tiver certeza.`;

async function perguntarIA(texto) {
  const key = localStorage.getItem(KEY_API), model = localStorage.getItem(KEY_MODEL) || "gemini-3.5-flash-lite";
  passo("🤖 Pensando com a IA...");
  ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    let contents = history.filter(h => h.type === "user" || h.type === "bot").slice(-10).map(h => ({ role: h.type === "user" ? "user" : "model", parts: [{ text: String(h.text).slice(0, 12000) }] }));
    while (contents.length && contents[0].role !== "user") contents.shift();
    const nome = RizikBrain.recall("userName");
    let sis = SISTEMA + (nome ? "\nO usuário se chama " + nome + "." : "");
    if (ultimoArquivo) sis += "\n\nARQUIVO/TEXTO MAIS RECENTE DO USUÁRIO (" + ultimoArquivo.nome + "):\n" + ultimoArquivo.texto.slice(0, 30000);
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent", {
      method: "POST", signal: ctrl.signal, headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: sis }] }, contents, generationConfig: { maxOutputTokens: 8192, temperature: 0.3, topP: 0.9 } })
    });
    if (!r.ok) {
      falar(r.status === 400 || r.status === 403 ? "A chave parece inválida. Gere outra em aistudio.google.com e use /chave SUA_CHAVE."
        : r.status === 404 ? "Esse modelo não está disponível pra sua chave. Troque com /modelo gemini-3.8-flash"
        : r.status === 429 ? "Atingi o limite grátis por agora. Aguarde um minuto e tente de novo."
        : "A IA retornou erro " + r.status + ". Tente novamente.");
      return;
    }
    const d = await r.json(), cand = d?.candidates?.[0];
    let resp = (cand?.content?.parts || []).map(x => x.text || "").join("").trim();
    if (cand?.finishReason === "MAX_TOKENS") resp += "\n\n(Resposta cortada pelo limite. Peça: continue)";
    falar(resp || "A IA não devolveu resposta. Tente reformular.", "bot", "🤖 IA conectada");
  } catch (e) {
    if (e.name !== "AbortError") { console.error(e); falar("Não consegui falar com a IA agora. Verifique a internet e tente de novo."); }
  } finally { clearTimeout(timer); ctrl = null; }
}

/* ---------- arquivos ---------- */
function mostrarPreview(p) {
  const d = mk("div", "msg bot"), el = document.createElement(p.kind === "video" ? "video" : "img"); el.src = p.url;
  if (p.kind === "video") { el.controls = true; el.muted = true; el.playsInline = true; }
  d.appendChild(el); chat.appendChild(d);
}
async function processarArquivo(f) {
  busy(true); cancelado = false; falar("📎 " + f.name, "user"); pensando = pensar();
  passo("📂 Abrindo " + f.name + "...");
  try {
    const r = await Arquivos.lerMidia(f, passo);
    if (r.preview) mostrarPreview(r.preview);
    let resposta = r.resumo, pasta = r.pasta, texto = "";
    if (r.tipo === "texto") {
      passo("📖 Lendo o conteúdo...");
      resposta = Saber.lerTexto(r.texto); pasta = Mente.pasta(Saber.isCode(r.texto) ? "Códigos" : "Textos"); texto = r.texto; Mente.setTexto(f.name, r.texto);
      ultimoArquivo = { nome: f.name, texto: r.texto };
    }
    const a = Arquivos.salvar({ nome: f.name, pasta, texto, resumo: resposta.slice(0, 300), tipo: r.tipo });
    falar(resposta + "\n\n📁 Guardei em: " + a.pasta + "/" + a.nome + "\nVeja tudo com /arquivos" + (texto && localStorage.getItem(KEY_API) ? "\n💡 Pergunte qualquer coisa sobre esse arquivo." : ""));
  } catch (e) { console.error(e); falar("Não consegui abrir esse arquivo. " + (e.message || "")); }
  finally { busy(false); }
}

/* ---------- histórico de conversas (15 páginas) ---------- */
function novaConversa() {
  try { speechSynthesis.cancel(); } catch {}
  Historico.nova(); history = []; try { localStorage.removeItem(HISTORY_KEY); } catch {}
  chat.innerHTML = ""; hist.classList.remove("aberto");
  falar("Nova conversa! 🧹 A anterior ficou guardada no histórico (menu +). Sua memória de aprendizado continua guardada.", "bot", "", true);
}
function abrirConversa(id) {
  const msgs = Historico.abrir(id); if (!msgs) return;
  history = msgs.map(m => ({ text: m.text, type: m.type }));
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch {}
  chat.innerHTML = ""; restaurar(); hist.classList.remove("aberto");
}
function abrirHistorico(pag = 1, termo = "") {
  const r = Historico.listar(pag, termo);
  hist.innerHTML = ""; hist.classList.add("aberto");
  hist.onclick = e => { if (e.target === hist) hist.classList.remove("aberto"); };
  const box = mk("div", "hbox"), top = mk("div", "htopo"), fechar = mk("button", "", "✕"), busca = mk("input");
  busca.type = "text"; busca.placeholder = "Buscar nas conversas..."; busca.value = termo;
  busca.onkeydown = e => { if (e.key === "Enter") abrirHistorico(1, busca.value); };
  fechar.onclick = () => hist.classList.remove("aberto");
  top.append(mk("b", "", "🕘 Histórico"), busca, fechar);
  const lista = mk("div", "hlista");
  if (!r.itens.length) lista.append(mk("div", "hvazio", termo ? "Nada encontrado." : "Ainda não há conversas salvas."));
  for (const s of r.itens) {
    const li = mk("div", "hitem" + (s.id === r.atual ? " atual" : "")), info = mk("div", "hinfo"), del = mk("button", "", "🗑");
    info.append(mk("div", "htit", s.titulo), mk("div", "hmeta", new Date(s.em).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) + " • " + s.qtd + " msgs" + (s.id === r.atual ? " • atual" : "")));
    info.onclick = () => abrirConversa(s.id);
    del.onclick = e => { e.stopPropagation(); if (!confirm("Apagar esta conversa do histórico?")) return; const nova = Historico.apagar(s.id); if (nova) { history = []; try { localStorage.removeItem(HISTORY_KEY); } catch {} chat.innerHTML = ""; falar("Conversa apagada. Começamos uma nova! 🧹", "bot", "", true); } abrirHistorico(r.pagina, termo); };
    li.append(info, del); lista.append(li);
  }
  const pg = mk("div", "hpag"), ant = mk("button", "", "◀"), prox = mk("button", "", "▶");
  ant.disabled = r.pagina <= 1; prox.disabled = r.pagina >= r.paginas;
  ant.onclick = () => abrirHistorico(r.pagina - 1, termo); prox.onclick = () => abrirHistorico(r.pagina + 1, termo);
  pg.append(ant);
  for (let p = 1; p <= r.paginas; p++) { const b = mk("button", p === r.pagina ? "on" : p > r.totalPaginas ? "vazia" : "", String(p)); b.onclick = () => abrirHistorico(p, termo); pg.append(b); }
  pg.append(prox);
  const rod = mk("div", "hrod"), novo = mk("button", "", "➕ Nova conversa"), tudo = mk("button", "", "🗑 Apagar tudo");
  novo.onclick = novaConversa;
  tudo.onclick = () => { if (!confirm("Apagar TODO o histórico de conversas? A memória de aprendizado não é apagada.")) return; Historico.limparTudo(); history = []; try { localStorage.removeItem(HISTORY_KEY); } catch {} chat.innerHTML = ""; hist.classList.remove("aberto"); falar("Histórico apagado. Sua memória de aprendizado continua guardada.", "bot", "", true); };
  rod.append(mk("span", "", r.total + " conversa(s) • página " + r.pagina + " de " + r.paginas), novo, tudo);
  box.append(top, lista, pg, rod); hist.append(box);
}

/* ---------- /basedados: exporta TUDO (memória, conversas, interface, código) ---------- */
async function exportarBase() {
  passo("📦 Reunindo memória, conversas, interface e módulos...");
  const b = await Base.montar({
    history, idAtual: Historico.idAtual(), status: STATUS, statsMente: Mente.stats(), totalFatos: Fatos.total,
    estado: { modoProfundo, lerAuto, temChaveIA: !!localStorage.getItem(KEY_API), modelo: localStorage.getItem(KEY_MODEL) || "padrão" },
    menu: [...document.querySelectorAll("#menu button")].map(x => x.textContent.trim())
  });
  falar("📦 BASE DE DADOS DA BACH — " + new Date().toLocaleString("pt-BR") + "\n\nTabela da criação dela:\n```txt\n" + b.tabelaModulos + "\n```\nMemória e dados:\n```txt\n" + b.tabelaDados + "\n```\nBackup completo: " + b.tamanhoKb + " KB, com " + b.conversas + " conversa(s) do histórico, memória, arquivos, pesquisas, vocabulário, o estado da tela (interface) e o código de todos os módulos. Use os botões do cartão abaixo. A chave da IA externa nunca entra. Para restaurar depois: /importarbase", "bot", "📦 /basedados");
  chat.appendChild(cartao("📦 " + b.nome + " • " + b.tamanhoKb + " KB", b.json, b.nome, false, 2500));
  chat.scrollTop = chat.scrollHeight;
}

/* ---------- ler link colado ---------- */
async function lerLinkMsg(url, texto, temIA) {
  passo("🔗 Abrindo o link: " + url.slice(0, 60) + "...");
  try {
    const r = await Saber.lerLink(url), leitura = Saber.lerTexto(r.texto);
    const a = Arquivos.salvar({ nome: r.nome, pasta: Mente.pasta(Saber.isCode(r.texto) ? "Códigos" : "Textos"), texto: r.texto, resumo: leitura.slice(0, 300), tipo: "link" });
    ultimoArquivo = { nome: a.nome, texto: r.texto }; Mente.setTexto(a.nome, r.texto);
    if (temIA && texto.replace(url, "").trim().length > 3) { await perguntarIA(texto); return; }
    falar("🔗 Abri " + r.url + "\n\n" + leitura + "\n\n📁 Guardei em: " + a.pasta + "/" + a.nome + "\n💡 Agora pergunte: “o que é esse texto?”, “resume” ou “revisa o código”.", "bot", "🔗 link");
  } catch (e) { console.error(e); falar("Não consegui abrir esse link. Se for repositório privado ou uma página que bloqueia leitura, copie o texto e cole aqui. 📋"); }
}

/* ---------- roteamento ---------- */
const sn = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();

async function rotear(texto) {
  const cmd = texto.toLowerCase().trim(), nt = sn(texto), temIA = !!localStorage.getItem(KEY_API);
  if (/^\/(basedados|dadosbach)\b/.test(cmd)) return exportarBase();
  if (/^\/importarbase\b/.test(cmd)) { falar("📥 Escolha o arquivo .json que você baixou com /basedados."); $("seletorBase").click(); return; }
  if (cmd.startsWith("/modelo ")) { localStorage.setItem(KEY_MODEL, texto.slice(8).trim()); falar("Modelo trocado para: " + texto.slice(8).trim()); return; }

  const links = Saber.urlsEm(texto); if (links.length) return lerLinkMsg(links[0], texto, temIA);
  if (/^(exportar|exporta|backup|baixar|salvar)( a| o| minha| meus| toda| todas| tudo| os| as| seus)*( memoria| dados| base| base de dados| conversas)?$/.test(nt) ||
      /\b(manda|mande|envia|envie|da|de|exporta|exporte) (me )?(os |todos os |seus |tudo |todos )*(dados|backup|base de dados)\b/.test(nt) || nt === "basedados") return exportarBase();

  const prof = extrairProfundo(texto); if (prof !== null) return pesquisaProfunda(prof);
  const cons = extrairPesquisa(texto); if (cons !== null) return pesquisaProfunda(cons, false);
  if (/^(?:(?:qual|como)\s+(?:est[aá]\s+)?(?:o|a)\s+)?(?:clima|tempo|previs[aã]o(?:\s+do\s+tempo)?)\s*\??$/i.test(texto)) { falar("De qual cidade? Diga: clima em (sua cidade) 🌤️"); return; }
  const cid = extrairClima(texto); if (cid) return clima(cid);

  const arq = Arquivos.comando(texto); if (arq) { falar(arq, "bot", "📁 seus arquivos"); return; }

  if (!Mente.jogando()) {
    const eu = Fatos.sobreMim(texto); if (eu) { falar(eu, "bot", "🧠 sobre mim"); return; }
    const fato = Fatos.responder(texto); if (fato) { falar(fato, "bot", "📘 base de fatos"); return; }
  }
  const mt = Mente.responder(texto);
  if (mt) {
    if (mt.noticias) return noticias(mt.q);
    if (mt.pesquisa) { if (temIA) return perguntarIA(texto); return pesquisaProfunda(mt.pesquisa, mt.fundo !== false); }
    falar(mt.texto, "bot", mt.origem || "🧠 minha mente"); return;
  }

  passo("🧠 Consultando minha memória...");
  const r = RizikBrain.think(texto);

  if (r.intent === "longtext") {
    const cod = Saber.isCode(texto), leitura = Saber.lerTexto(texto);
    const a = Arquivos.salvar({ texto, pasta: Mente.pasta(cod ? "Códigos" : "Textos"), resumo: leitura.slice(0, 300) });
    ultimoArquivo = { nome: a.nome, texto }; Mente.setTexto(a.nome, texto);
    if (temIA) { await perguntarIA(texto); return; }
    falar(leitura + "\n\n📁 Guardei em: " + a.pasta + "/" + a.nome + "\nVeja tudo com /arquivos\n💡 Agora pergunte: “o que é esse texto?”, “resume” ou “revisa o código”."); return;
  }
  if (r.handled) { falar(r.text, "bot", "🧠 minha memória e regras"); return; }

  if (temIA) { await perguntarIA(texto); return; }

  const graca = Prog.humor(texto); if (graca) { falar(graca, "bot", "😄 meu repertório"); return; }
  const prog = Prog.responder(texto); if (prog) { falar(prog, "bot", "💻 programação"); return; }
  const k = Saber.buscarConhecimento(texto); if (k) { falar(k, "bot", "📚 o que aprendi"); return; }
  if ((modoProfundo && texto.split(/\s+/).length >= 3 && !Fatos.sobreVoce(texto)) || Mente.pergunta(texto)) return pesquisaProfunda(texto);
  falar(Prog.desconhecido(texto) + "\n\nVocê pode:\n• me pedir: jogar forca, crie uma calculadora, o que é ...\n• me ensinar: ensine: pergunta => resposta\n• pedir: pesquise a fundo sobre o assunto\n• colar um link para eu ler\n• clima em (sua cidade)\n\nDigite \"ajuda\" para ver tudo.");
}

async function enviar() {
  if (ocupado) { parar(); return; }
  const texto = entrada.value.trim(); if (!texto) return;
  entrada.value = "";
  if (/^(\/clear|\/limpar|\/nova|nova conversa|limpar histórico)$/i.test(texto)) { novaConversa(); return; }
  if (/^(\/historico|\/histórico|histórico|historico)(\s+\d+)?$/i.test(texto)) { abrirHistorico(parseInt((texto.match(/\d+/) || [1])[0], 10) || 1); return; }
  if (/^\/chave\s+/i.test(texto)) {
    const v = texto.replace(/^\/chave\s+/i, "").trim(); falar("/chave ••••••", "user");
    if (v.toLowerCase() === "apagar") { localStorage.removeItem(KEY_API); falar("Chave apagada. Voltei ao modo sem IA externa."); }
    else if (v.length < 20) falar("Essa chave parece curta demais. Copie a chave inteira do Google AI Studio.");
    else { localStorage.setItem(KEY_API, v); falar("Chave salva neste aparelho ✅ Agora respondo tudo com IA: textos, código, jogos e apps."); }
    return;
  }
  cancelado = false; busy(true); falar(texto, "user"); pensando = pensar(); passo("👀 Lendo sua mensagem...");
  try { await rotear(texto); }
  catch (e) { console.error(e); falar("Deu um erro inesperado. Tente de novo."); }
  finally { if (pensando) { pensando.fim(); pensando = null; } busy(false); }
}

/* ---------- menu, voz, eventos ---------- */
const menu = $("menu"), seletor = $("seletor");
$("mais").onclick = () => menu.classList.toggle("aberto");
menu.onclick = e => {
  const b = e.target.closest("button[data-acao]"); if (!b) return; menu.classList.remove("aberto");
  const a = b.dataset.acao;
  if (a === "anexar") seletor.click();
  if (a === "profundo") { modoProfundo = !modoProfundo; b.textContent = "🧠 Pensar bastante: " + (modoProfundo ? "ligado" : "desligado"); falar(modoProfundo ? "Modo pensar bastante LIGADO 🧠" : "Modo pensar bastante desligado."); }
  if (a === "voz") { lerAuto = !lerAuto; b.textContent = "🔊 Ler respostas sozinha: " + (lerAuto ? "ligado" : "desligado"); if (!lerAuto) speechSynthesis.cancel(); }
  if (a === "historico") abrirHistorico(1);
  if (a === "nova") novaConversa();
  if (a === "base") { entrada.value = "/basedados"; enviar(); }
  if (a === "arquivos") { entrada.value = "/arquivos"; enviar(); }
  if (a === "piada") { entrada.value = "conta uma piada"; enviar(); }
  if (a === "jogo") { entrada.value = "vamos jogar"; enviar(); }
};
$("seletorBase").onchange = async () => {
  const f = $("seletorBase").files[0]; $("seletorBase").value = ""; if (!f) return;
  try { const n = Base.importar(JSON.parse(await f.text())); alert("✅ Backup restaurado (" + n + " partes). A tela vai recarregar."); location.reload(); }
  catch (e) { falar("Não consegui restaurar: " + (e.message || "arquivo inválido"), "bot", "", true); }
};
seletor.onchange = async () => { const L = [...seletor.files]; seletor.value = ""; for (const f of L) await processarArquivo(f); };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
$("mic").onclick = () => {
  if (!SR) { falar("Seu navegador não tem reconhecimento de voz. Tente no Chrome.", "bot", "", true); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = "pt-BR"; rec.interimResults = true; $("mic").classList.add("gravando");
  rec.onresult = e => { entrada.value = [...e.results].map(r => r[0].transcript).join(" "); };
  rec.onend = () => { rec = null; $("mic").classList.remove("gravando"); if (entrada.value.trim()) entrada.focus(); };
  rec.onerror = () => { rec = null; $("mic").classList.remove("gravando"); };
  rec.start();
};
botao.onclick = enviar;
entrada.addEventListener("keydown", e => { if (e.key === "Enter") enviar(); });

try { Historico.salvarAtual(history); } catch {}
restaurar(); status.textContent = STATUS;
if (!history.length) falar("Olá! Sou a BACH AI 🧠. Converso, resumo textos, programo, crio jogos e apps e jogo com você. Digite \"ajuda\" para ver tudo.");
