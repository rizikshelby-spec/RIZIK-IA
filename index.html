<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e1a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; worker-src 'self' blob: https://cdn.jsdelivr.net; child-src 'self' blob: data:; frame-src 'self' blob: data:; connect-src 'self' https: data: blob:; object-src 'none'; base-uri 'self';">
<title>BACH AI</title>
<style>
:root{
  --bg:#0d0e1a;--panel:rgba(20,22,38,.90);--panel2:rgba(14,16,30,.96);
  --border:rgba(138,118,255,.32);--accent:#8266ff;--accent2:#e056fd;
  --text:#f5f6ff;--muted:#b4b8d8;--bot:rgba(22,25,46,.78);--user:rgba(88,58,205,.54);
  --orb1:#8c6eff;--orb2:#ff4fd8;--orbGlow:rgba(140,110,255,.65);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at top,rgba(255,255,255,.04),transparent 55%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;transition:background .4s ease}
#orb-bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.68}
header,#modos,#chat,#barras,footer{position:relative;z-index:1}

header{padding:11px 16px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);flex:none}
.htop{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto}
#btnDrawer{width:40px;height:40px;padding:0;font-size:20px;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.hbrand{flex:1;min-width:0}
.htitle{display:flex;align-items:center;gap:8px}
h2{margin:0;background:linear-gradient(90deg,#fff,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:19px}
#verBadge{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--border);color:var(--text);cursor:pointer;font-weight:bold}
#verBadge.nova{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent}
#status{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}

#modos{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;background:var(--panel2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);flex:none;-webkit-overflow-scrolling:touch}
#modos::-webkit-scrollbar{display:none}
.modo{flex:none;padding:6px 12px;font-size:12px;font-weight:normal;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:999px;color:var(--text);cursor:pointer;transition:.2s;white-space:nowrap}
.modo.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;font-weight:bold;box-shadow:0 2px 12px var(--orbGlow)}

#chat{flex:1;min-height:0;overflow-y:auto;padding:14px 12px 22px;width:100%;max-width:860px;margin:0 auto;display:block}
.msg{padding:11px 14px;margin:10px 0 4px;border-radius:17px;max-width:min(86%,680px);width:fit-content;line-height:1.52;overflow-wrap:anywhere;font-size:14.5px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,.22)}
.msg .t{white-space:pre-wrap}
.bot{background:var(--bot);border:1px solid var(--border);border-bottom-left-radius:6px;margin-right:auto}
.user{background:var(--user);border:1px solid rgba(255,255,255,.22);border-bottom-right-radius:6px;margin-left:auto}
.pensando{opacity:.9;border-style:dashed;white-space:pre-line}

.acoes{display:flex;gap:6px;margin:2px 2px 8px;flex-wrap:wrap}
.acoes.user{justify-content:flex-end}
.acoes button{padding:4px 10px;font-size:12px;font-weight:normal;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);border-radius:10px;color:var(--text)}
.meta{color:var(--muted);font-size:11px;margin:0 4px 10px;white-space:pre-line}

.cartao{border:1px solid var(--border);border-radius:12px;margin:8px 0;background:rgba(10,12,24,.68);overflow:hidden;min-width:230px}
.topo{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px;color:#e4ddff}
.topo span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topo button{padding:5px 10px;font-size:12px;font-weight:normal;background:rgba(255,255,255,.12);border-radius:8px}
.cartao details{border-top:1px solid rgba(255,255,255,.1)}
.cartao summary{padding:6px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.cartao pre{margin:0;padding:10px;max-height:320px;overflow:auto;font-size:12px;line-height:1.45;white-space:pre-wrap;color:#eef0ff}

.result{background:var(--bot);border:1px solid var(--border);border-radius:14px;padding:11px 14px;margin:8px 0;max-width:min(86%,680px);font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.result h3{margin:0 0 6px;color:#fff;font-size:14px}.result a{color:var(--accent2);overflow-wrap:anywhere;font-weight:bold}
.msg img,.msg video{max-width:100%;border-radius:12px;display:block}

footer{flex:none;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:9px 12px;padding-bottom:max(9px,env(safe-area-inset-bottom))}
.fwrap{display:flex;align-items:flex-end;gap:8px;width:100%;max-width:860px;margin:0 auto}
input[type=text]{flex:1;min-width:0;padding:11px;border:1px solid var(--border);border-radius:12px;background:rgba(0,0,0,.38);color:#fff;font-size:16px}
button{padding:10px 15px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:bold;cursor:pointer}
button.stop{background:#c0392b}
#mais,#mic{width:44px;height:44px;padding:0;font-size:20px;background:rgba(255,255,255,.09);border:1px solid var(--border);border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center}
#enviar{height:44px;border-radius:14px;flex:none;padding:0 16px}
#mic.gravando{background:#c0392b;border-color:transparent}

#menu{display:none;position:fixed;left:max(12px,calc(50% - 420px));bottom:calc(70px + env(safe-area-inset-bottom));background:var(--panel2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:16px;padding:8px;z-index:18;min-width:270px;max-width:calc(100vw - 24px);max-height:68dvh;overflow-y:auto;box-shadow:0 14px 36px rgba(0,0,0,.6)}
#menu.aberto{display:flex;flex-direction:column;gap:3px}
#menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;padding:10px 12px;font-weight:normal;font-size:14.5px;border-radius:11px;color:var(--text)}
#menu button:hover,#menu button:active{background:rgba(255,255,255,.09)}
#menu .msep{height:1px;background:var(--border);margin:4px 6px}

#drawerBack{display:none;position:fixed;inset:0;background:rgba(0,0,0,.58);backdrop-filter:blur(4px);z-index:20}
#drawerBack.aberto{display:flex}
#drawer{width:min(316px,85vw);height:100%;background:var(--panel2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 14px;gap:8px;overflow:auto}
.dhead{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--border)}
.dhead b{font-size:17px;color:#fff}
.dsub{font-size:11.5px;color:var(--muted);margin-top:3px}
.dclose{padding:7px 11px;background:rgba(255,255,255,.1);border-radius:10px}
.dsec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:6px 4px 0}
.dbtn{width:100%;text-align:left;background:rgba(255,255,255,.06);border:1px solid var(--border);padding:10px 12px;font-weight:normal;font-size:14px;border-radius:12px}
.dbtn.admErr{border-color:#ff4d6d;background:rgba(255,77,109,.16);font-weight:bold}
.dtemas{display:flex;flex-wrap:wrap;gap:7px;padding:4px 2px}
.tpill{padding:6px 11px;font-size:12px;border-radius:999px;border:1px solid rgba(255,255,255,.22);font-weight:bold;background:rgba(255,255,255,.08)}
.tpill.on{box-shadow:0 0 0 2px #fff}
.dinfo{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.55}

#hist,#sobre,#errosModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(4px);z-index:30;align-items:flex-end;justify-content:center}
#hist.aberto,#sobre.aberto,#errosModal.aberto{display:flex}
.hbox,.sbox,.ebox{background:var(--panel2);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88dvh;display:flex;flex-direction:column;padding:16px;gap:10px;overflow:auto}
.sbox{border-radius:18px;margin:auto 12px;max-width:520px}
.htopo{display:flex;gap:8px;align-items:center}.htopo b{color:#fff;white-space:nowrap}
.htopo input{padding:8px 10px;font-size:14px}.htopo button{padding:8px 12px;background:rgba(255,255,255,.12)}
.hlista{overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px;min-height:120px}
.hitem{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.hitem.atual{border-color:var(--accent)}.hinfo{flex:1;min-width:0;cursor:pointer}
.htit{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hmeta{font-size:11px;color:var(--muted);margin-top:3px}
.hitem button{background:none;padding:6px 8px}.hvazio{color:var(--muted);text-align:center;padding:24px 0;font-size:14px}
.hpag{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.hpag button{min-width:32px;padding:6px 0;font-size:13px;background:rgba(255,255,255,.1)}
.hpag button.on{background:var(--accent)}.hpag button.vazia{opacity:.35}.hpag button:disabled{opacity:.3}
.hrod{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.hrod button{padding:6px 10px;font-size:12px;background:rgba(255,255,255,.1)}
.ebar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ebar button{padding:6px 10px;font-size:12px;background:rgba(255,255,255,.1)}
.ebar button.danger{background:rgba(231,76,60,.35);border:1px solid rgba(231,76,60,.6)}
.ebar button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.eitem{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;padding:10px}
.eitem input[type=checkbox]{margin-top:4px;width:18px;height:18px;accent-color:var(--accent2);flex:none}
.einfo{flex:1;min-width:0;font-size:13px;line-height:1.45}
.etipo{display:inline-block;font-size:10px;font-weight:bold;padding:2px 6px;border-radius:6px;background:rgba(255,77,109,.25);color:#ffb3c1;margin-right:6px}
.edata{font-size:11px;color:var(--muted)}
.eitem button{background:rgba(231,76,60,.25);padding:5px 8px;font-size:13px;flex:none}
.scard{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:13px;line-height:1.55}
[hidden]{display:none!important}
textarea#entrada{flex:1;min-width:0;min-height:44px;padding:10px 13px;border:1px solid var(--border);border-radius:14px;background:rgba(0,0,0,.38);color:#fff;font-size:16px;font-family:inherit;line-height:1.35;resize:none;max-height:130px;overflow-y:auto}
#barras{flex:none;background:var(--panel);border-top:1px solid var(--border)}
#citbar,#anexos{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12px;color:#e5dcff;flex-wrap:wrap;max-width:860px;margin:0 auto}
#citbar{flex-wrap:nowrap;border-left:3px solid var(--accent)}
#citbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#citbar button,#anexos button{padding:3px 9px;font-size:12px;background:rgba(255,255,255,.12)}
.chip{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.1);border-radius:10px;padding:4px 6px 4px 10px;max-width:100%;overflow-wrap:anywhere}
.cit{border-left:3px solid var(--accent2);background:rgba(0,0,0,.28);border-radius:8px;padding:5px 9px;margin-bottom:8px;font-size:12px;color:#e9dfff;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<canvas id="orb-bg" aria-hidden="true"></canvas>

<header>
  <div class="htop">
    <button id="btnDrawer" aria-label="Abrir menu">☰</button>
    <div class="hbrand">
      <div class="htitle"><h2>BACH AI 🧠</h2><span id="verBadge" title="Sobre e novidades">v5.5</span></div>
      <div id="status">Carregando...</div>
    </div>
  </div>
</header>

<nav id="modos" aria-label="Modos de funcionamento">
  <button class="modo on" data-modo="auto">🤖 Automático</button>
  <button class="modo" data-modo="raciocinio">🧠 Raciocínio</button>
  <button class="modo" data-modo="pesquisa">🌐 Pesquisa</button>
  <button class="modo" data-modo="aprendizado">📚 Aprendizado</button>
  <button class="modo" data-modo="programacao">💻 Programação</button>
  <button class="modo" data-modo="matematica">🔢 Matemática</button>
  <button class="modo" data-modo="visao">👁 Imagens</button>
  <button class="modo" data-modo="voz">🎙 Voz</button>
  <button class="modo" data-modo="criatividade">✍ Criatividade</button>
  <button class="modo" data-modo="documentos">📄 Documentos</button>
</nav>

<main id="chat"></main>
<div id="barras"><div id="citbar" hidden></div><div id="anexos" hidden></div></div>

<footer>
  <div class="fwrap">
    <button id="mais" aria-label="Mais opções">+</button>
    <textarea id="entrada" rows="1" enterkeyhint="enter" placeholder="Mensagem ou /ajuda..." autocomplete="off"></textarea>
    <button id="mic" aria-label="Falar">🎤</button>
    <button id="enviar">Enviar</button>
  </div>
</footer>

<div id="menu">
  <button data-acao="anexar">📎 Anexar foto, vídeo ou arquivo</button>
  <button data-acao="arquivos">📁 Meus arquivos</button>
  <div class="msep"></div>
  <button data-acao="profundo">🧠 Pensar bastante: desligado</button>
  <button data-acao="voz">🔊 Ler respostas sozinha: desligado</button>
  <div class="msep"></div>
  <button data-acao="jogo">🎮 Jogar um joguinho</button>
  <button data-acao="copiarChat">📋 Copiar conversa inteira</button>
  <button data-acao="auditar">🩺 Auditar erros do chat</button>
  <button data-acao="errosAdm" id="menuErrosAdm" hidden>🚨 Erros do Público (0)</button>
  <div class="msep"></div>
  <button data-acao="sobre">ℹ Sobre a BACH AI</button>
</div>

<div id="drawerBack">
  <aside id="drawer" aria-label="Menu do aplicativo">
    <div class="dhead">
      <div>
        <b>BACH AI 🧠</b>
        <div class="dsub" id="drawerUser">Criada por Rizik • Gratuita</div>
      </div>
      <button class="dclose" id="fecharDrawer">✕</button>
    </div>

    <button class="dbtn admErr" data-d="errosAdm" id="drawerErrosAdm" hidden>🚨 Erros do Público (0)</button>

    <div class="dsec">Conversas e Arquivos</div>
    <button class="dbtn" data-d="nova">➕ Nova conversa</button>
    <button class="dbtn" data-d="historico">🕘 Histórico de conversas</button>
    <button class="dbtn" data-d="arquivos">📁 Meus arquivos</button>
    <button class="dbtn" data-d="anexar">📎 Anexar mídia / documento</button>

    <div class="dsec">Ferramentas e Diversão</div>
    <button class="dbtn" data-d="copiarChat">📋 Copiar conversa inteira</button>
    <button class="dbtn" data-d="auditar">🩺 Auditar erros do chat</button>
    <button class="dbtn" data-d="jogo">🎮 Jogos no chat</button>

    <div class="dsec">🎨 Temas e Cores (ou peça no chat!)</div>
    <div class="dtemas" id="listaTemas"></div>

    <button class="dbtn" data-d="sobre">ℹ Sobre o App &amp; Atualizações</button>
    <div class="dinfo">
      <b>Criador:</b> Rizik<br>
      <b>Versão:</b> 5.5 (2026)<br>
      100% Própria • Rede Neural + RAG IndexedDB + memória em 3 camadas.
    </div>
  </aside>
</div>

<input id="seletor" type="file" hidden multiple accept="image/*,video/*,.txt,.md,.js,.html,.css,.json,.csv,.py,.xml,.log,.ts,.java,.c,.cpp,.sql,.yml,.yaml">
<div id="hist"></div>
<div id="sobre"></div>
<div id="errosModal"></div>
<input id="seletorBase" type="file" hidden accept=".json,application/json">

<script>
(function(){
  const c = document.getElementById("orb-bg");
  const ctx = c && c.getContext ? c.getContext("2d") : null;
  if (!ctx) return;
  let c1 = [140,110,255], c2 = [255,79,216];
  const hex = s => {
    const h = String(s || "").replace("#", "");
    return h.length === 6 ? [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)] : [140,110,255];
  };
  window.__setOrbColors = (a, b) => { c1 = hex(a); c2 = hex(b); };

  const PTS = [], N = 140, phi = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = phi * i;
    PTS.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r, s: i % 5 === 0 ? 2.2 : 1.25 });
  }
  const RINGS = [{rx:0,ry:0,rz:0},{rx:.55,ry:4,rz:.2},{rx:-.6,ry:.8,rz:-.3},{rx:1.05,ry:-.35,rz:.6},{rx:1.45,ry:.2,rz:-.7}];
  let W = 0, H = 0, dpr = 1;
  const resize = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = c.width = Math.max(1, Math.floor(window.innerWidth * dpr));
    H = c.height = Math.max(1, Math.floor(window.innerHeight * dpr));
  };
  resize(); window.addEventListener("resize", resize);
  const rot = (p, ax, ay) => {
    const cy = Math.cos(ay), sy = Math.sin(ay), x1 = p.x * cy - p.z * sy, z1 = p.x * sy + p.z * cy;
    const cx = Math.cos(ax), sx = Math.sin(ax);
    return { x: x1, y: p.y * cx - z1 * sx, z: p.y * sx + z1 * cx };
  };
  function draw(now) {
    const t = now * 0.001;
    ctx.clearRect(0, 0, W, H);
    const cx = W * 0.5 + Math.sin(t * 0.42) * 34 * dpr;
    const cy = H * 0.5 + Math.cos(t * 0.34) * 28 * dpr;
    const R = Math.min(W, H) * 0.24 * (1 + 0.075 * Math.sin(t * 2.1) + 0.03 * Math.cos(t * 4.7));
    const [r1,g1,b1] = c1, [r2,g2,b2] = c2;

    const aura = ctx.createRadialGradient(cx, cy, R * 0.1, cx, cy, R * 1.45);
    aura.addColorStop(0, "rgba(255,255,255,.32)");
    aura.addColorStop(0.28, "rgba(" + r1 + "," + g1 + "," + b1 + ",.24)");
    aura.addColorStop(0.65, "rgba(" + r2 + "," + g2 + "," + b2 + ",.12)");
    aura.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(cx, cy, R * 1.45, 0, Math.PI * 2); ctx.fill();

    for (let i = 0; i < 12; i++) {
      const a = t * 0.25 + (i * Math.PI) / 6, len = R * (0.95 + 0.35 * Math.sin(t * 3 + i * 1.7));
      const g = ctx.createLinearGradient(cx, cy, cx + Math.cos(a) * len, cy + Math.sin(a) * len);
      g.addColorStop(0, "rgba(255,255,255,.45)");
      g.addColorStop(0.45, "rgba(" + r1 + "," + g1 + "," + b1 + ",.24)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.strokeStyle = g; ctx.lineWidth = (i % 3 === 0 ? 1.8 : 0.9) * dpr;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len); ctx.stroke();
    }

    const ax = t * 0.35, ay = t * 0.55;
    for (let k = 0; k < RINGS.length; k++) {
      const an = RINGS[k]; ctx.beginPath();
      for (let s = 0; s <= 56; s++) {
        const a = (s / 56) * Math.PI * 2;
        const p = rot({ x: Math.cos(a), y: Math.sin(a) * Math.cos(an.rx), z: Math.sin(a) * Math.sin(an.rx) }, ax + an.ry, ay + an.rz);

const extrairProfundo = t => (t.match(/^(?:(?:fa[cç]a|faz|pode)\s+)?(?:uma\s+)?(?:(?:pesquise|pesquisa|pesquisar|busque|busca|procure)\s+(?:a\s*fundo|profundamente|em\s+profundidade|bem\s+fundo)|pesquisa profunda|aprofunde|\/profundo)\s*(?:sobre\s+|a respeito de\s+)?(.+)/i) || [])[1]?.trim() ?? null;

async function pesquisaProfunda(q, fundo = true, salvarArquivo = false) {
  const temas = dividirTemas(q);

  q = temas[0] || q;
  const temaLimpo = Mente.tema(q) || q;
  ultimoTema = temaLimpo;
  const engDepth = LLM.getConfig?.().reasoningDepth === "profundo";
  const usarFundo = modoProfundo || modoCriador || modoAtual === "raciocinio" || engDepth || fundo;

  let deuFato = false;
  if (/\b(piadas?|humor|engra[cç]ad[oa]s?)\b/i.test(q)) {
    const pResp = SkillRouter.handle("piada");
    falar(pResp?.texto || ("😄 " + Prog.humor("conta uma piada")), "bot", "😄 piada interativa");

  passo((usarFundo ? "🔎 Pesquisando a fundo: " : "🔎 Pesquisando: ") + temaLimpo);

    const r = await Saber.pesquisaProfunda(q, passo, usarFundo, { semLimite: modoCriador });

    if (r.conf !== "baixa") { Mente.lembrarTema(temaLimpo); RizikBrain.logTopic(temaLimpo); }

      Arquivos.salvar({ nome: "pesquisa-" + temaLimpo.slice(0, 32), pasta: Mente.pasta("Pesquisas"), texto: r.texto, tipo: "pesquisa" });
    }
    r.fontes.forEach(f => criarResultado(f.titulo, "", f.url));
  } catch (e) {
    console.error(e);
    if (e.message === "irrelevante" && deuFato) return;

      falar("Não consigo prever uma lista completa de lançamentos futuros do próximo mês sem um calendário específico. Se quiser recomendações atuais, peça `filmes recentes` ou `animes da temporada`.");
      return;

      registrarErroPublico("meta-referencia", q, "meta-referencia", "referência à resposta da IA");

      return;
    }
    const msgErr = e.message === "irrelevante"
      ? "Não achei resultados confiáveis para “" + temaLimpo + "”. Tente perguntar com outras palavras."
      : "Não consegui consultar a internet agora. No modo local continuo respondendo normalmente.";
    registrarErroPublico("pesquisa-falhou", q, msgErr, e.message || "erro");

    falar(msgErr);
  }

function imagemParaBase64(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file), img = new Image();
    const timer = setTimeout(() => { URL.revokeObjectURL(url); resolve(null); }, 10000);
    img.onload = () => {
      clearTimeout(timer);
      try {
        const max = 1280, esc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.naturalWidth * esc)); c.height = Math.max(1, Math.round(img.naturalHeight * esc));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve({ mimeType: "image/jpeg", base64: c.toDataURL("image/jpeg", 0.85).split(",")[1] });
      } catch { resolve(null); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { clearTimeout(timer); URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

      return;
    }
    if (rev.tipo === "sync") {
      falar(rev.texto, "bot", "📝 revisor fiel");
      return;
    }
  }

  const mLangOnly = texto.trim().match(/^(?:em|para|pra)\s+(?:o\s+|a\s+)?(portugu[eê]s|ingl[eê]s|espanhol|franc[eê]s|italiano|alem[aã]o|japon[eê]s)\s*[!?.]*$/i);
  if (mLangOnly && (alvo || ultimoArquivo?.texto)) {
    const mapL = { portugues: "pt", ingles: "en", espanhol: "es", frances: "fr", italiano: "it", alemao: "de", japones: "ja" };
    const codL = mapL[sn(mLangOnly[1])] || "pt";
    const qTr = extrairAlvoTraducao();
    if (qTr) {
      passo("🌍 Traduzindo...");
      const rTr = await Dic.consultar({ tipo: "trad", q: qTr, alvo: codL }, passo);
      if (rTr) { NLUNeural.registrarSucessoAposFalha(texto, "traducao_texto"); falar(rTr, "bot", "🌍 dicionário"); return; }
    }
  }

  if (Mente.jogando()) {
    const mtJogo = Mente.responder(texto, { alvo });
    if (mtJogo) { falar(mtJogo.texto, "bot", mtJogo.origem || "🎮 jogo"); return; }
  }

  const arq = Arquivos.comando(texto); if (arq) { falar(arq, "bot", "📁 seus arquivos"); return; }
  if (/^\/(pastas?|mover|palavras?)\b/i.test(texto)) {
    const mtCmd = Mente.responder(texto, { alvo });
    if (mtCmd) { falar(mtCmd.texto, "bot", mtCmd.origem); return; }
  }

  const dept = SkillRouter.handle(texto, { hasAI: false, history, mode: modoAtual, mood: tomInfo.mood, modoCriador });
  if (dept) {
    NLUNeural.registrarSucessoAposFalha(texto, /^\/?app|cria/i.test(texto) ? "criar_app" : /^\/?termux|terminal/i.test(texto) ? "termux_dev" : "utilidades");
    falar(dept.texto, "bot", dept.origem);
    if (dept.previewHtml) {
      chat.appendChild(ExecutorSandbox.criarCardPreview(dept.previewHtml, dept.previewTitle));
      chat.scrollTop = chat.scrollHeight;
    }
    return;
  }

  const links = Saber.urlsEm(texto);
  if (links.length && texto.length < 400 && !Saber.isCode(texto) && texto.replace(links[0], "").trim().split(/\s+/).filter(Boolean).length <= 12) {
    if (/\b(bom|ruim|presta|avalia|analisa|nota|erros?)\b/i.test(tn)) {
      passo("🌐 Avaliando o site " + links[0] + "...");
      falar(await Revisor.avaliarSite(links[0]), "bot", "🌐 avaliador de sites");
      return;
    }
    return lerLinkMsg(links[0]);
  }

  const segCorr = AutoCorretor.processarSeguimentoDeCorrecao?.(texto, history.slice(0, -1));
  if (segCorr) {
    if (segCorr.tipo === "pesquisar") {
      falar(segCorr.aviso, "bot", "🔄 aprendizado");
      return pesquisaProfunda(segCorr.query, true, true);
    }
    if (segCorr.texto) {
      falar(segCorr.texto, "bot", "🧠 aprendi com você");
      return;
    }
  }

  const excl = AutoCorretor.tratarExclamacao(texto, history.slice(0, -1));
  if (excl) { falar(excl, "bot", "💬 conversa"); return; }

  if (AutoCorretor.ehReclamacao(texto)) {
    const acao = AutoCorretor.analisarEPreparar(history.slice(0, -1), { ultimoArquivo, ultimoTema, ultimaMidiaInfo, alvo });
    atualizarBadge();
    if (acao) {
      if (acao.tipo === "clima") {
        falar(acao.aviso, "bot", "🔄 autocorreção");
        const cidSalva = (() => { try { return localStorage.getItem("bach_cidade"); } catch { return null; } })();
        const cidR = extrairClima(acao.pergunta) || cidSalva;
        if (cidR) return clima(cidR);
        aguardaCidade = true; falar("De qual cidade? Me diga só o nome (ex.: Londrina) 🌤"); return;
      }
      if (acao.tipo === "traducao") {
        falar(acao.aviso, "bot", "🔄 autocorreção");
        const qTr = extrairAlvoTraducao(acao.cit);
        const rTr = await Dic.consultar({ tipo: "trad", q: qTr, alvo: "pt" }, passo);
        if (rTr) { falar(rTr, "bot", "🌍 dicionário"); return; }
      }
      if (acao.tipo === "pesquisar") {
        falar(acao.aviso, "bot", "🔄 autocorreção");
        return pesquisaProfunda(acao.query, true, true);
      }
      if (acao.texto) {
        falar(acao.texto, "bot", "🔄 autocorreção");
        return;
      }
    }
  }

  passo("🧠 Consultando minhas 3 camadas de memória...");
  const r = RizikBrain.think(texto);
  if (r.intent === "longtext") {
    const cod = Saber.isCode(texto), leitura = Saber.lerTexto(texto);
    const a = Arquivos.salvar({ texto, pasta: Mente.pasta(cod ? "Códigos" : "Textos"), resumo: leitura.slice(0, 300) });
    ultimoArquivo = { nome: a.nome, texto }; Mente.setTexto(a.nome, texto);
    ultimaImagem = null; ultimaMidiaInfo = null;
    RizikBrain.logTopic(a.nome);
    const revExtra = cod ? "\n\n" + Revisor.revisarCodigoFiel(texto) : "";
    falar(leitura + revExtra + "\n\n📁 Guardei em: " + a.pasta + "/" + a.nome + "\nVeja tudo com /arquivos\n💡 Agora pergunte: “explica”, “cadeia de códigos”, “resume”, “/rag pergunta”, “/revisar” ou “/executar”.");
    return;
  }

  const MEMORIA_DIRETA = new Set([
    "learning", "forget", "synonym", "name-set", "note", "notes", "export", "import",
    "stats", "help", "profile-memory", "autocorrected", "declined", "confirm", "memorySummary", "learned", "name",
    "city", "age", "likes"
  ]);
  if (r.handled && MEMORIA_DIRETA.has(r.intent)) {
    falar(r.text, "bot", "🧠 minha memória");
    return;
  }

  const ehCurtaNaoCodigo = !Saber.isCode(texto) && texto.length <= 160 && tn.split(" ").length <= 18;
  if (ehCurtaNaoCodigo && ultimaMidiaInfo?.tipo === "video" && /\b(audio|som|voz|fala|falou|disse|falei|cantou)\b/.test(tn)) {
    falar("🎬 Eu ainda não transcrevo a fala ou áudio dentro de vídeos — por enquanto analiso duração, resolução, cores predominantes e textos escritos na tela do vídeo.", "bot", "🎬 análise de vídeo");
    return;
  }
  const perguntaMidiaLocal = ehCurtaNaoCodigo &&
    /\b(escrito|escrita|diz|dizendo|aparece|tem aqui|tem nessa|tem na|ve|ver|descrev|analisa|leia|mostra)\b/.test(tn) &&
    /\b(aqui|foto|imagem|print|video|isso|essa|esse|nele|nela|escrito)\b/.test(tn) &&
    !/\b(traduz|traduza|traduzir)\b/.test(tn);
  if (perguntaMidiaLocal && (ultimaMidiaInfo || ultimoArquivo)) {
    if (ultimoArquivo?.texto) {
      const querCodigo = /\b(codigo|copiar|bloco|txt)\b/.test(tn);
      const txtCheio = Arquivos.obterTextoCompleto?.(ultimoArquivo.nome) || ultimoArquivo.texto;
      falar(querCodigo
        ? "📝 Texto completo de **" + ultimoArquivo.nome + "** pronto para copiar:\n\n" + wrapFence(txtCheio, "txt")
        : "📝 Texto encontrado em **" + ultimoArquivo.nome + "**:\n\n“" + txtCheio.slice(0, 4000) + "”",
        "bot", "👁 leitura direta");
      return;
    }
    if (ultimaMidiaInfo) { falar(ultimaMidiaInfo.resumo, "bot", "👁 análise de mídia"); return; }
  }

  if ((modoAtual === "documentos" || /\b(nos meus arquivos|no meu arquivo|no documento|nos documentos|no texto que enviei|no arquivo que mandei)\b/.test(tn)) &&
      Arquivos.buscarRAG && Arquivos.total?.() > 0 && !/^(resume|resuma|explica|explique|revisa)/.test(tn)) {
    const ragHits = Arquivos.buscarRAG(texto, 3);
    if (ragHits.length) {
      falar("📄 **Encontrei nos seus arquivos salvos (RAG local):**\n\n" +
        ragHits.map((h, i) => (i + 1) + ". **" + h.pasta + "/" + h.arquivo + "** (relevância " + h.score + ")\n“" + h.trecho.slice(0, 460) + "”").join("\n\n"),
        "bot", "📄 RAG documentos");
      return;
    }
  }

  const cidSalva = (() => { try { return localStorage.getItem("bach_cidade"); } catch { return null; } })();
  const pedeClimaSemCidade =
    /^(?:(?:olha|ver|veja|mostra|qual|como)\s+(?:(?:o|a|est[aá]|ta|t[aá]|[ée])\s+)?)?(?:o\s+)?(?:clima|tempo|previs[aã]o(?:\s+do\s+tempo)?)(?:\s+(?:para|pra|de|em))?(?:\s+(?:hoje|hj|agora|amanh[aã]|amanha))?\s*\??$/i.test(texto) ||
    /^(?:como\s+(?:est[aá]|ta|t[aá]|anda)\s+(?:o\s+)?(?:tempo|clima)(?:\s+(?:hoje|hj|agora))?)\s*\??$/i.test(texto) ||
    /^(?:tem|vai|vem|est[aá]|ta|t[aá]|esta)\s+.{0,15}(?:chuva|chover|chovendo)(?:\s+(?:hoje|hj|agora|amanh[aã]|amanha))?\s*\??$/i.test(texto);
  if (pedeClimaSemCidade) {
    if (cidSalva) return clima(cidSalva);
    aguardaCidade = true; falar("De qual cidade? Me diga só o nome (ex.: Londrina) 🌤"); return;
  }
  const cid = extrairClima(texto); if (cid) return clima(cid);

  if (modoAtual === "pesquisa") return pesquisaProfunda(extrairProfundo(texto) || extrairPesquisa(texto) || texto, true, true);
  if (modoAtual === "visao") {
    if (!ultimaImagem && !ultimaMidiaInfo) { falar("👁 Modo Imagens ativo: toque no + para enviar uma foto ou vídeo!"); return; }
    falar(ultimaMidiaInfo?.resumo || "Envie uma foto pelo + para eu analisar.", "bot", "👁 análise de imagem"); return;
  }
  if (modoAtual === "documentos") {
    if (!ultimoArquivo && !(Arquivos.total?.() > 0)) { falar("📄 Modo Documentos ativo: cole um texto longo, um link ou anexe um arquivo pelo +."); return; }
    if (ultimoArquivo) {
      const mtDoc = Mente.responder(texto, { alvo });
      if (mtDoc?.texto) { falar(mtDoc.texto, "bot", "📄 documentos"); return; }
    }
    falar("📄 Não achei esse trecho nos seus arquivos. Tente `/rag palavra-chave` ou anexe um novo documento pelo +.", "bot", "📄 documentos");
    return;
  }

  if (/\b(jogar|jogo da velha|jogo da forca|forca|adivinhe o numero)\b/i.test(tn) && !/\b(crie|criar|faca|fazer|programe|explique|o que e|fora|lixo|oq|nao)\b/i.test(tn)) {
    const mtJ = Mente.responder(texto, { alvo });
    if (mtJ?.texto) { NLUNeural.registrarSucessoAposFalha(texto, "humor_jogo"); falar(mtJ.texto, "bot", mtJ.origem || "🎮 jogos"); return; }
  }
  if (/^\s*(?:quais\s+(?:sao\s+)?(?:as\s+)?)?(?:ultimas\s+)?noticias(?:\s+(?:do|de)\s+(?:brasil|mundo|hoje))?\s*\??$/i.test(tn)) {
    return noticias(/brasil/i.test(texto) ? "ultimas noticias do brasil hoje" : "ultimas noticias do mundo hoje");
  }

  const av = await CerebroAvancado.responder(texto, {
    ultimoArquivo, ultimoTema, ultimaMidiaInfo, ultimoBot: ultimoBotTexto(),
    alvo, session: tomInfo.session || RizikBrain.getSessionState?.(),
    modoCriador, nome: RizikBrain.recall("userName"),
    history, mood: tomInfo.mood, humorScore: tomInfo.score
  });
  if (av) {
    if (av.tema) {
      const nomeT = aplicarTema(av.tema);
      falar("🎨 Pronto! Mudei o visual para **" + nomeT + "** (inclusive a esfera 3D do fundo!). Se sair do site e voltar, ele continua assim. ✨", "bot", "🎨 temas");
      return;
    }
    if (av.usarMenteTexto && ultimoArquivo?.texto) {
      const mtTex = Mente.responder(texto, { alvo }) || { texto: Saber.lerTexto(ultimoArquivo.texto), origem: "📖 leitura do arquivo" };
      falar(mtTex.texto, "bot", mtTex.origem || "📖 leitura do arquivo");
      return;
    }
    if (av.pesquisarTema) { NLUNeural.registrarSucessoAposFalha(texto, "pesquisa"); return pesquisaProfunda(av.pesquisarTema, true, true); }
    if (av.texto) {
      if (av.origem !== "🔄 autocorreção") NLUNeural.registrarSucessoAposFalha(texto, "conversa_geral");
      falar(av.texto, "bot", av.origem || "🧠 BACH AI");
      return;
    }
  }

  const prof = extrairProfundo(texto); if (prof !== null) { NLUNeural.registrarSucessoAposFalha(texto, "pesquisa"); return pesquisaProfunda(prof, true, true); }
  const cons = extrairPesquisa(texto); if (cons !== null) { NLUNeural.registrarSucessoAposFalha(texto, "pesquisa"); return pesquisaProfunda(cons, modoProfundo || modoCriador, true); }

  if (await seguir(texto)) return;

  const pedidoDic = Dic.detectar(texto);
  if (pedidoDic && pedidoDic.q === "__ALVO__") pedidoDic.q = extrairAlvoTraducao();
  if (pedidoDic && pedidoDic.tipo !== "def") {
    passo("🌍 Consultando dicionário e tradutor...");
    const respDic = await Dic.consultar(pedidoDic, passo);
    if (respDic) { NLUNeural.registrarSucessoAposFalha(texto, "traducao_texto"); if (pedidoDic.q && pedidoDic.q !== "__ALVO__") RizikBrain.logTopic(pedidoDic.q.slice(0, 60)); falar(respDic, "bot", "🌍 dicionário"); return; }
  }

  const eu = Fatos.sobreMim(texto); if (eu) { NLUNeural.registrarSucessoAposFalha(texto, "habilidades"); falar(eu, "bot", "🧠 sobre mim"); return; }
  const fato = Fatos.responder(texto);
  if (fato) { NLUNeural.registrarSucessoAposFalha(texto, "pesquisa"); ultimoTema = Mente.tema(texto) || texto; RizikBrain.logTopic(ultimoTema); falar(fato, "bot", "📘 base de fatos"); return; }
  if (pedidoDic && pedidoDic.tipo === "def") {
    passo("📖 Consultando dicionário...");
    const respDic = await Dic.consultar(pedidoDic, passo);
    if (respDic) { NLUNeural.registrarSucessoAposFalha(texto, "traducao_texto"); ultimoTema = pedidoDic.q; RizikBrain.logTopic(pedidoDic.q); falar(respDic, "bot", "📖 dicionário"); return; }
  }

  const papo = Conversa.responder(texto, ctxConversa(tomInfo));
  if (papo) {
    NLUNeural.registrarSucessoAposFalha(texto, /\bsabe\b|\bentende\b/.test(tn) ? "habilidades" : "conversa_geral");
    falar(papo, "bot", "💬 conversa");
    return;
  }

  const mt = Mente.responder(texto, { alvo });
  if (mt) {
    NLUNeural.registrarSucessoAposFalha(texto, mt.pesquisa ? "pesquisa" : "termux_dev");
    if (mt.noticias) return noticias(mt.q);
    if (mt.pesquisa) return pesquisaProfunda(mt.pesquisa, mt.fundo !== false, false);
    if (mt.apagar) { const resAp = Arquivos.comando("/apagar " + mt.apagar); falar(resAp || "Não consegui apagar esse arquivo.", "bot", "🗑 arquivos"); return; }
    falar(mt.texto, "bot", mt.origem || "🧠 minha mente"); return;
  }

  if (r.handled) {
    NLUNeural.registrarSucessoAposFalha(texto, r.intent === "capabilities" ? "habilidades" : "conversa_geral");
    falar(r.text, "bot", "🧠 minha memória");
    return;
  }

  const graca = Prog.humor(texto); if (graca) { NLUNeural.registrarSucessoAposFalha(texto, "humor_jogo"); falar(graca, "bot", "😄 meu repertório"); return; }
  const prog = Prog.responder(texto); if (prog) { NLUNeural.registrarSucessoAposFalha(texto, "termux_dev"); falar(prog, "bot", "💻 programação"); return; }

  const podeBuscarCache = Mente.pergunta(texto) || parecePerguntaGeral(texto, tn) ||
    /\b(pesquis|explica|resum|quem foi|o que e|historia)\b/.test(tn);
  const k = podeBuscarCache ? Saber.buscarConhecimento(texto) : null;
  if (k) { NLUNeural.registrarSucessoAposFalha(texto, "pesquisa"); falar(k, "bot", "📚 o que aprendi"); return; }

  if (/^\/[a-z0-9_-]+/i.test(texto.trim())) {
    const tok = texto.trim().split(/\s+/)[0].toLowerCase();
    if (/^\/(juda|ajud|ajda|ajdua|ajuda+)$/.test(tok)) {
      falar("💡 Você digitou `" + tok + "` — abri o `/ajuda` pra você:\n\n" + EditorADM.ajudaComandos(modoCriador), "bot", "⌨ comandos");
      return;
    }
    const msgCmd = "⌨ Não reconheci o comando `" + tok + "`. Digite `/ajuda` para ver todos os comandos.";
    registrarErroPublico("comando-invalido", texto, msgCmd, "comando / desconhecido");
    falar(msgCmd, "bot", "⌨ comandos");
    return;
  }

  if (Mente.pergunta(texto) || parecePerguntaGeral(texto, tn)) {
    if (Fatos.sobreVoce(texto)) { falar("Sou a BACH AI 🧠! Pode me perguntar de outro jeito ou digitar `/ajuda` para ver tudo que sei fazer.", "bot", "🧠 sobre mim"); return; }
    const tm = Mente.tema(texto) || tn;
    if (tm && tm.length >= 2) return pesquisaProfunda(texto, true, false);
    const respVaga = "Pode me explicar um pouquinho melhor o que você quer saber? 🤔";
    NLUNeural.marcarFalha(texto);
    registrarErroPublico("vaga", texto, respVaga, "pergunta sem tema claro");
    falar(respVaga); return;
  }

  const memSem = RizikBrain.searchMemory ? RizikBrain.searchMemory(texto) : [];
  if (memSem.length && memSem[0].score >= 0.68) {
    falar("🧠 Lembrei de algo relacionado na minha memória:\n• " + memSem[0].texto, "bot", "🧠 memória semântica");
    return;
  }

  const dec = NLUNeural.decidir(texto, ctxConversa(tomInfo));
  if (dec) {
    if (dec.pesquisar) return pesquisaProfunda(dec.pesquisar, true, false);
    if (dec.criarApp) {
      const appRes = SkillRouter.handle("/app " + dec.criarApp, { hasAI: false, history, mode: modoAtual, mood: tomInfo.mood, modoCriador });
      if (appRes) {
        falar(appRes.texto, "bot", "🧬 rede neural (" + Math.round(dec.confidence * 100) + "%)");
        if (appRes.previewHtml) {
          chat.appendChild(ExecutorSandbox.criarCardPreview(appRes.previewHtml, appRes.previewTitle));
          chat.scrollTop = chat.scrollHeight;
        }
        return;
      }
    }
    if (dec.texto) {
      falar(dec.texto, "bot", "🧬 rede neural (" + Math.round(dec.confidence * 100) + "%)");
      return;
    }
  }

  const desc = Prog.desconhecido(texto, ctxConversa(tomInfo));
  if (!Prog.ehTeclaOuNumeroSolto?.(texto)) {
    RizikBrain.setPendingError?.(texto, desc);
    NLUNeural.marcarFalha(texto);
    registrarErroPublico("nao-entendeu", texto, desc, "nenhum módulo reconheceu");
  }
  falar(desc);
}

function ajustar() { entrada.style.height = "auto"; entrada.style.height = Math.max(44, Math.min(entrada.scrollHeight, 130)) + "px"; }
function desenharAnexos() {
  const box = $("anexos"); box.innerHTML = ""; box.hidden = !pendentes.length;
  pendentes.forEach((f, i) => {
    const c = mk("span", "chip", "📎 " + f.name), x = mk("button", "", "✕");
    x.onclick = () => { pendentes.splice(i, 1); desenharAnexos(); };
    c.append(x); box.append(c);
  });
}
function limparCit() { citacao = null; const b = $("citbar"); b.hidden = true; b.innerHTML = ""; }
function responderA(texto, tipo) {
  citacao = { texto: String(texto), tipo };
  const bar = $("citbar"), x = mk("button", "", "✕"); bar.innerHTML = ""; bar.hidden = false; x.onclick = limparCit;
  bar.append(mk("span", "", "↩ Respondendo " + (tipo === "user" ? "a você: " : "à BACH: ") + String(texto).replace(/\s+/g, " ").slice(0, 90)), x);
  entrada.focus();
}

async function enviar() {
  if (ocupado) { parar(); return; }
  const texto = entrada.value.trim(), arquivos = pendentes.splice(0);
  if (!texto && !arquivos.length) return;
  if (lerAuto || modoAtual === "voz") Voz.desbloquear?.();
  entrada.value = ""; ajustar(); desenharAnexos();
  const cit = citacao ? (citacao.tipo === "user" ? "Você: " : "BACH: ") + citacao.texto.replace(/\s+/g, " ").slice(0, 160) : "";
  alvo = citacao ? citacao.texto : null; limparCit();

  if (!arquivos.length) {
    if (/^(\/clear|clear|\/limpar|\/nova|nova conversa|limpar hist[oó]rico)$/i.test(texto)) { alvo = null; novaConversa(); return; }
    if (/^(\/copiar|copiar chat|copiar conversa|copiar tudo)$/i.test(texto)) { alvo = null; copiarChatInteiro(); return; }
    if (/^(\/historico|\/histórico|histórico|historico)(\s+\d+)?$/i.test(texto)) { alvo = null; abrirHistorico(parseInt((texto.match(/\d+/) || [1])[0], 10) || 1); return; }
    if (/^(sobre|sobre a bach|vers[aã]o|sobre o app)$/i.test(texto)) { alvo = null; abrirSobre(); return; }

    const cmdGH = EditorADM.comandoConfig(texto, modoCriador);
    if (cmdGH) {
      alvo = null;
      falar(cmdGH.secret ? texto.split(/\s+/).slice(0, 2).join(" ") + " ••••••" : texto, "user", "", false, cit);
      falar(cmdGH.texto, "bot", "⚙ github adm", true);
      return;
    }

    const cmdLLM = LLM.command(texto);
    if (cmdLLM) {
      alvo = null;
      falar(cmdLLM.secret ? texto.split(/\s+/)[0] + " ••••••" : texto, "user", "", false, cit);
      falar(cmdLLM.text, "bot", "⚙ motor próprio", true); status.textContent = statusPadrao(); return;
    }
  }

  if (arquivos.length) {
    for (const f of arquivos) { if (cancelado) break; await processarArquivo(f, false); }
    if (!texto || cancelado) { alvo = null; return; }
  }

  cancelado = false; busy(true);
  const ehSegredoAdm = texto.length <= 80 && !/\n/.test(texto) && /^\/(adm|admsenha)\s+\S+/i.test(texto);
  const bolhaUser = ehSegredoAdm
    ? texto.split(/\s+/)[0] + " ••••••"
    : EditorADM.ativo(modoCriador) && texto.length > 200
      ? "📦 [Código enviado para o módulo no Editor ADM • " + texto.split("\n").length + " linhas]"
      : texto;
  falar(bolhaUser, "user", "", false, cit);
  pensando = pensar(); passo("👀 Analisando sua mensagem...");
  try { await rotear(texto); }
  catch (e) {
    console.error(e);
    registrarErroPublico("erro-execucao", texto, e.message || "erro inesperado", "try-catch rotear");
    falar("Deu um erro inesperado: " + (e.message || "tente novamente."));
  }
  finally { if (pensando) { pensando.fim(); pensando = null; } alvo = null; busy(false); }
}

$("modos").onclick = e => {
  const b = e.target.closest("button[data-modo]"); if (!b) return;
  document.querySelectorAll("#modos .modo").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); modoAtual = b.dataset.modo;
  if (modoAtual === "voz") { lerAuto = true; Voz.desbloquear?.(); const bv = menu.querySelector('[data-acao="voz"]'); if (bv) bv.textContent = "🔊 Ler respostas sozinha: ligado"; }
  const descModo = SkillRouter.modePrompt ? SkillRouter.modePrompt(modoAtual) : "";
  status.textContent = descModo ? (NOMES_MODOS[modoAtual] + " — " + descModo.replace(/^MODO [^:]+:\s*/i, "")) : statusPadrao();
  setTimeout(() => { if (!ocupado) status.textContent = statusPadrao(); }, 3500);
};

const drawerBack = $("drawerBack"), menu = $("menu"), seletor = $("seletor");
$("btnDrawer").onclick = () => { menu.classList.remove("aberto"); atualizarBadge(); drawerBack.classList.add("aberto"); };
$("fecharDrawer").onclick = () => drawerBack.classList.remove("aberto");
drawerBack.onclick = e => { if (e.target === drawerBack) drawerBack.classList.remove("aberto"); };
$("verBadge").onclick = abrirSobre;

$("drawer").onclick = e => {
  const b = e.target.closest("button[data-d]"); if (!b) return;
  drawerBack.classList.remove("aberto");
  const d = b.dataset.d;
  if (d === "errosAdm") abrirErrosADM("");
  if (d === "nova") novaConversa();
  if (d === "copiarChat") copiarChatInteiro();
  if (d === "auditar") rodarAuditoria();
  if (d === "historico") abrirHistorico(1);
  if (d === "arquivos") { entrada.value = "/arquivos"; enviar(); }
  if (d === "anexar") seletor.click();
  if (d === "jogo") { entrada.value = "vamos jogar"; enviar(); }
  if (d === "sobre") abrirSobre();
};

$("mais").onclick = e => {
  e.stopPropagation();
  atualizarBadge();
  menu.classList.toggle("aberto");
};
document.addEventListener("click", e => {
  if (menu.classList.contains("aberto") && !menu.contains(e.target) && e.target !== $("mais")) {
    menu.classList.remove("aberto");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") menu.classList.remove("aberto");
});

menu.onclick = e => {
  const b = e.target.closest("button[data-acao]"); if (!b) return; menu.classList.remove("aberto");
  const a = b.dataset.acao;
  if (a === "anexar") seletor.click();
  if (a === "copiarChat") copiarChatInteiro();
  if (a === "auditar") rodarAuditoria();
  if (a === "errosAdm") abrirErrosADM("");
  if (a === "profundo") { modoProfundo = !modoProfundo; b.textContent = "🧠 Pensar bastante: " + (modoProfundo ? "ligado" : "desligado"); falar(modoProfundo ? "Modo pensar bastante LIGADO 🧠" : "Modo pensar bastante desligado."); }
  if (a === "voz") { lerAuto = !lerAuto; b.textContent = "🔊 Ler respostas sozinha: " + (lerAuto ? "ligado" : "desligado"); if (lerAuto) Voz.desbloquear?.(); else Voz.parar(); }
  if (a === "arquivos") { entrada.value = "/arquivos"; enviar(); }
  if (a === "jogo") { entrada.value = "vamos jogar"; enviar(); }
  if (a === "sobre") abrirSobre();
};

$("seletorBase").onchange = async () => {
  const f = $("seletorBase").files[0]; $("seletorBase").value = ""; if (!f) return;
  try { const n = Base.importar(JSON.parse(await f.text())); alert("✅ Backup restaurado (" + n + " partes). A tela vai recarregar."); location.reload(); }
  catch (e) { falar("Não consegui restaurar: " + (e.message || "arquivo inválido"), "bot", "", true); }
};
seletor.onchange = () => {
  const L = [...seletor.files]; seletor.value = ""; pendentes.push(...L); desenharAnexos();
  status.textContent = "📎 " + pendentes.length + " anexo(s) prontos. Escreva sua pergunta e toque em Enviar.";
  entrada.focus();
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
$("mic").onclick = () => {
  if (!SR) { falar("Seu navegador não tem reconhecimento de voz. Tente no Chrome.", "bot", "", true); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = "pt-BR"; rec.interimResults = true; $("mic").classList.add("gravando");
  rec.onresult = e => { entrada.value = [...e.results].map(r => r[0].transcript).join(" "); ajustar(); };
  rec.onend = () => { rec = null; $("mic").classList.remove("gravando"); if (entrada.value.trim()) entrada.focus(); };
  rec.onerror = () => { rec = null; $("mic").classList.remove("gravando"); };
  rec.start();
};
botao.onclick = enviar;
entrada.addEventListener("input", ajustar);
entrada.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    const isTouch = navigator.maxTouchPoints > 0 && window.innerWidth < 768;
    if (!isTouch) { e.preventDefault(); enviar(); }
  }
});

aplicarTema(temaAtual);
atualizarBadge();
status.textContent = falhas.length ? "⚠ Erro em: " + falhas[0] : statusPadrao();
ajustar();
try { Historico.salvarAtual(history); } catch {}
try { restaurar(); } catch (e) { console.warn(e); }
if (falhas.length) {
  falar("⚠ Alguns módulos não carregaram no GitHub: " + falhas.join(", ") + "\nConfira os nomes ou cole esses arquivos inteiros.", "bot", "⚠ diagnóstico", true);
} else if (!history.length) {
  const nomeSalvo = RizikBrain.recall("userName");
  falar((nomeSalvo ? "Olá, **" + nomeSalvo + "**! " : "Olá! ") + "Sou a **BACH AI** 🧠 (v" + APP_VER + "), com motor próprio, Rede Neural 3.0, RAG em IndexedDB e memória em 3 camadas. Digite `/ajuda` para ver os comandos ou mande o que você precisa.", "bot", "", true);
}
</script>
